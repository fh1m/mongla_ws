name: Proof of Contribution Check

# The PR body is attacker-controlled: anyone who can open a pull request
# writes it. It reaches the checker through `env:`, which is data, never
# through `${{ }}` inside a script, which the runner pastes into the shell as
# source text before bash runs (issue #54).
#
# The decision is tools/provenance_check.py, with its tests in the integrity
# job: an exact declaration line or a populated AI Provenance table, outside
# code fences and quotes (#97). It records what the author declares; it does
# not verify how the code was made.
#
# This job also runs tools/ci_contract.py over both required workflows. A
# job skipped by `if:` reports Success to branch protection, so the
# integrity job cannot be trusted to check its own shape (#93).
#
# `permissions` is explicit, because the default token depends on a
# repository setting not visible here. The failure comment needs
# `pull-requests: write`; nothing else needs more than read.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  poc-check:
    name: Verify AI Provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the contract's YAML parser
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Check for AI Provenance section
        id: poc
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 tools/provenance_check.py
      - name: Check the required workflows keep their shape
        run: python3 tools/ci_contract.py
      - name: Post or update the status comment (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- poc-check -->';
            const body = [
              marker,
              '## Proof of Contribution Check Failed',
              '',
              'The run log says which part failed. For provenance, the description needs either',
              'a line that reads exactly `Provenance: 100% human-written`, or:',
              '',
              '```',
              '## AI Provenance',
              '| # | Author / Handle | Source URL | What came from this person |',
              '|---|---|---|---|',
              '| 1 | handle | https://... | Specific insight used |',
              '```',
              '',
              'Neither may sit inside a code block or a quote. Editing the description re-runs this check.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
