name: Proof of Contribution Check

# ⛔ The PR body is attacker-controlled. Anyone who can open a pull request
# writes it, including a first-time contributor from a fork.
#
# Until 2026-09-30 this workflow did:
#
#     PR_BODY="${{ github.event.pull_request.body }}"
#
# `${{ }}` is substituted by the Actions runner BEFORE bash ever sees the
# script, so the body is pasted into the shell as source text. A description
# containing a quote and a semicolon runs commands on the runner with the job's
# `GITHUB_TOKEN` in its environment. This is GitHub's own documented script
# injection (issue #54).
#
# The fix is to pass the body through `env:`. An environment variable is data:
# the runner sets it, bash never parses it, and `"$PR_BODY"` expands to exactly
# the bytes the author typed no matter what they are.
#
# `permissions` is least-privilege and explicit, because the default token
# depends on a repository setting that is not visible in this file. The failure
# comment needs `pull-requests: write`; nothing here needs anything else. There
# is no checkout, because no step reads the repository.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  poc-check:
    name: Verify AI Provenance
    runs-on: ubuntu-latest

    steps:
      - name: Check for AI Provenance section
        id: poc
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if printf '%s' "$PR_BODY" | grep -qi "100% human-written"; then
            echo "status=exempt" >> "$GITHUB_OUTPUT"
            echo "✔ PR marked as 100% human-written — skipping provenance check."
            exit 0
          fi

          if printf '%s' "$PR_BODY" | grep -q "## 🤖 AI Provenance"; then
            if printf '%s' "$PR_BODY" | grep -qP "\|\s+\d+\s+\|\s+\S"; then
              echo "status=pass" >> "$GITHUB_OUTPUT"
              echo "✔ AI Provenance section found and populated."
            else
              echo "status=empty" >> "$GITHUB_OUTPUT"
              echo "✘ AI Provenance section exists but table appears empty."
              exit 1
            fi
          else
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "✘ No AI Provenance section found in PR description."
            exit 1
          fi

      - name: Post status comment (on failure)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "## ⚠️ Proof of Contribution Check Failed",
                "",
                "This PR appears to contain AI-assisted code but is missing an **AI Provenance** section.",
                "",
                "Please add the following to your PR description:",
                "",
                "```",
                "## 🤖 AI Provenance",
                "| # | Author / Handle | Source URL | What came from this person |",
                "|---|----------------|------------|---------------------------|",
                "| 1 | @handle        | https://... | Specific insight used     |",
                "```",
                "",
                "Not sure what to write? Run `python poc.py trace <filepath>` locally.",
                "",
                "> _If this PR is 100% human-written with no AI assistance, add the phrase_",
                "> _`100% human-written` anywhere in your PR description to skip this check._"
              ].join("\n")
            })
