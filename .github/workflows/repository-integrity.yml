name: Repository Integrity

# A fast policy gate on every PR and main push. This is deliberately ROS-free:
# generated interfaces must be built by the separate Jazzy job tracked in #65.
# No skip/continue-on-error: a violated invariant makes this check red.
# Its shape is an allowlist in tools/ci_contract.py.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    name: Source integrity / active-code and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install policy-test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8.2,<10' 'PyYAML>=6,<7' 'numpy>=1.26,<2' 'pymavlink==2.4.49'
      # The guard list lives in that one file; tools/ci_contract.py allows
      # this exact command and nothing else here, and the provenance job
      # runs the same contract, so skipping this job is caught there (#93).
      - name: Run the integrity guards
        run: python tools/run_repo_integrity.py
