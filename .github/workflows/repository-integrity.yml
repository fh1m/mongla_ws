name: Repository Integrity

# A fast policy gate on every PR and main push. This is deliberately ROS-free:
# generated interfaces must be built by the separate Jazzy job tracked in #65.
# No skip/continue-on-error: a violated invariant makes this check red.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-integrity:
    name: Source integrity / active-code and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install policy-test dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8.2,<10' 'PyYAML>=6,<7'
      - name: Run code reachability, docs, provenance and CI-contract guards
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pytest -q -p no:anyio \
            test/test_repository_integrity_workflow.py \
            test/test_claims_say_where_they_came_from.py \
            test/test_no_capability_is_unreachable_anywhere.py \
            test/test_the_retired_stack_stays_retired.py \
            test/test_package_xml_declares_imports.py \
            test/test_tools_point_at_files_that_exist.py \
            src/mongla_control/test/test_doc_drift.py \
            src/mongla_vision/test/test_no_capability_is_built_and_unreachable.py \
            src/mongla_vision/test/test_no_function_is_built_and_uncalled.py \
            src/mongla_manager/test/test_docs_contract.py \
            src/mongla_manager/test/test_ledger_claims.py
