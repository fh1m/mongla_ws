name: Wiki

# The wiki is where the docs are read and edited. Each page is also a file in
# this repo, because the doc guards run against files, in the same commit as
# the code they describe. This keeps the two the same, in both directions:
#
#   push to main  -> publish: refuse while the wiki holds an edit main does not
#                             have, else build the pages from the files and push
#                             them on top of the wiki's history (never --force)
#   wiki edit     -> pull:    turn the edited pages back into files, run the doc
#                             guards, commit to a review branch and open a PR.
#   merge PR      -> publish: regenerate wiki from the approved main branch
#
# If a wiki edit breaks a guard (a link to no page, a stale constant), it is not
# committed to main: it goes to a branch and a pull request says what failed.
# The edit stays in the wiki meanwhile. Opening that pull request needs the repo
# setting Actions -> General -> "Allow GitHub Actions to create and approve pull
# requests"; without it the branch is still pushed and the run says so.
#
# That pull request is opened with GITHUB_TOKEN, so GitHub creates its checks
# in an approval-required state: someone with write access opens the PR and
# presses "Approve workflows to run". Editing the description does not start
# them (GitHub docs, "Triggering a workflow from a workflow"; #94). Owner
# decision 2026-11-09: approve by hand, no app or personal token.
#
# How the conversion works and what it guarantees: tools/ci/wiki_build.py.
#
# The wiki's git repository exists only after its first page is created by hand
# (Wiki tab -> "Create the first page" -> Save). Until then publishing fails
# and says so.

on:
  push:
    branches: [main]
    paths:
      - '.claude/context/**'
      - 'docs/*.md'
      - 'tools/ci/wiki_build.py'
      - '.github/workflows/wiki.yml'
  gollum:
  workflow_dispatch:
    inputs:
      discard_wiki_edits:
        description: >-
          Publish over wiki edits main does not have. Only for an edit whose
          pull request was reviewed and closed; the wiki's history keeps it.
        type: boolean
        default: false

permissions:
  contents: write          # main, and <repo>.wiki.git
  pull-requests: write     # only when a wiki edit fails a guard

concurrency:
  group: wiki
  cancel-in-progress: false   # never drop a wiki edit half-way

env:
  # The doc guards that need nothing but Python. The rest need ROS and run on
  # the dev box with the full suite.
  GUARDS: >-
    src/mongla_manager/test/test_docs_contract.py
    src/mongla_control/test/test_doc_drift.py
    test/test_the_retired_stack_stays_retired.py
    test/test_the_wiki_is_built_from_the_book.py
    test/test_published_test_counts_are_the_last_run.py

jobs:
  pull:
    if: github.event_name == 'gollum' && github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    outputs:
      proposed: ${{ steps.commit.outputs.proposed }}
    steps:
      # A public wiki can be open to any GitHub user (repo Settings -> Wiki ->
      # "Restrict editing to users in teams with push access"). Only someone who
      # could push to main anyway gets an edit committed to it.
      - name: Only an editor with write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHO: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/${{ github.repository }}/collaborators/${WHO}/permission" --jq .permission || echo none)
          case "$perm" in admin|maintain|write) ;; *)
            echo "::error::${WHO} cannot push to this repository (${perm}); the wiki edit is not committed."
            exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { ref: main, fetch-depth: 0 }

      - name: Fetch the wiki
        run: git clone -q "https://github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"

      - name: Turn the pages back into files
        id: pull
        run: |
          python3 tools/ci/wiki_build.py pull "$RUNNER_TEMP/wiki" | tee "$RUNNER_TEMP/changed"
          [ -s "$RUNNER_TEMP/changed" ] && echo "any=1" >> "$GITHUB_OUTPUT" || echo "nothing changed"

      - name: Run the doc guards
        id: guards
        if: steps.pull.outputs.any == '1'
        continue-on-error: true
        run: |
          pip install -q pytest pyyaml numpy   # numpy: the banner check imports it
          python3 -m pytest -q -p no:cacheprovider $GUARDS 2>&1 | tee "$RUNNER_TEMP/guards"
          exit "${PIPESTATUS[0]}"

      - name: Propose wiki edit as a reviewable pull request
        id: commit
        if: steps.pull.outputs.any == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WHO: ${{ github.event.sender.login }}
          WHO_ID: ${{ github.event.sender.id }}
          PAGES: ${{ join(github.event.pages.*.title, ', ') }}
          GUARDS_OK: ${{ steps.guards.outcome == 'success' }}
        run: |
          git config user.name "$WHO"
          git config user.email "${WHO_ID}+${WHO}@users.noreply.github.com"
          git add -A .claude/context docs
          git commit -q -m "docs(wiki): ${PAGES}" -m "Edited in the wiki by ${WHO}."
          branch="wiki-edit/${GITHUB_RUN_ID}"
          # Never bypass the code, documentation, and evidence PR gates with
          # a direct commit to main, even when local doc-only guards pass.
          git push -q origin "HEAD:refs/heads/${branch}"
          {
            echo "Wiki edit by ${WHO}: ${PAGES}."
            echo
            echo "This branch must pass the same repository integrity and provenance"
            echo "checks as a normal code PR before merging into main. They wait for"
            echo "approval: open the Checks tab and press **Approve workflows to run**."
            echo
            # The wiki editor is the human source; tools/ci/provenance_check.py
            # reads this table (test_provenance_check.py runs this block).
            echo "## AI Provenance"
            echo
            echo "| # | Author / Handle | Source URL | What came from this person |"
            echo "|---|---|---|---|"
            echo "| 1 | ${WHO} | https://github.com/${GITHUB_REPOSITORY}/wiki | The wiki edit to: ${PAGES} |"
            echo
            if [ "$GUARDS_OK" != "true" ]; then
              echo "Local wiki guards failed; do not merge until they pass."
              echo
              echo '~~~'
              tail -40 "$RUNNER_TEMP/guards"
              echo '~~~'
            fi
          } > "$RUNNER_TEMP/body"
          if ! gh pr create --base main --head "$branch" \
                  --title "docs(wiki): ${PAGES}" --body-file "$RUNNER_TEMP/body"; then
            echo "::error::Wiki edit is on branch ${branch}; Actions cannot open a PR. Enable Actions > General > Allow GitHub Actions to create pull requests, or create one manually."
            exit 1
          fi
          echo "proposed=1" >> "$GITHUB_OUTPUT"
          # A broken edit must be visible as a failing workflow even when a PR
          # exists to repair it. The wiki itself keeps the human's edit.
          if [ "$GUARDS_OK" != "true" ]; then
            exit 1
          fi

  publish:
    needs: pull
    # Never overwrite an unreviewed wiki edit. Publish only after the
    # corresponding PR merges to main, or during an explicit manual publish.
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with: { ref: main }

      # The wiki as it is NOW, history and all. Building on top of it, rather
      # than a fresh history force-pushed over it, is what makes a concurrent
      # human edit a refused push instead of a silent loss (#68).
      - name: Fetch the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! git clone -q "https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git" "$RUNNER_TEMP/wiki"; then
            echo "::error::Could not clone the wiki. If it has no pages yet, open the Wiki tab, create any first page, save, then re-run this workflow."
            exit 1
          fi

      - name: Refuse to publish over an edit main does not have
        if: ${{ !inputs.discard_wiki_edits }}
        run: |
          # Only pages people changed since the bot last published. A page that
          # was edited and then merged to main reads the same as its file and
          # passes; one still in review, or saved while this run queued, does not.
          W="$RUNNER_TEMP/wiki"
          last=$(git -C "$W" log -1 --format=%H --author='github-actions\[bot\]')
          if [ -z "$last" ]; then mapfile -t touched < <(git -C "$W" ls-files '*.md')
          else mapfile -t touched < <(git -C "$W" diff --name-only "$last" HEAD -- '*.md'); fi
          [ "${#touched[@]}" -gt 0 ] || { echo "no edits since the last publish"; exit 0; }
          if ! python3 tools/ci/wiki_build.py check "$W" "${touched[@]}" > "$RUNNER_TEMP/pending"; then
            echo "::error::The wiki holds edits main does not have yet, so publishing would erase them:"
            sed 's/^/  /' "$RUNNER_TEMP/pending"
            echo "Merge (or close) the open docs(wiki) pull request, then re-run. A closed one: run this workflow by hand with discard_wiki_edits."
            exit 1
          fi

      - name: Build the pages
        run: |
          # Every page is regenerated, so a document removed from the book
          # loses its page; the wiki's own history keeps the old text.
          find "$RUNNER_TEMP/wiki" -maxdepth 1 -type f \( -name '*.md' -o -name '.mongla-pages.json' \) -delete
          python3 tools/ci/wiki_build.py build "$RUNNER_TEMP/wiki"

      - name: Push to the wiki
        env:
          REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/wiki"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "the wiki already matches main"; exit 0; fi
          git commit -q -m "Built from ${REPO}@$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          # A plain push: if someone saved a page since the clone above, it is
          # rejected, and that edit's own run imports it.
          if ! git push -q origin HEAD; then
            echo "::error::The wiki changed while this run built it (a new edit). Nothing was overwritten; its import run proposes it, and merging that publishes."
            exit 1
          fi
