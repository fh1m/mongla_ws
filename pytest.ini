[pytest]
# `-p no:anyio` is not a preference. The system pytest here is 6.2.5, and a pip
# `anyio` (pulled in by any FastAPI install) AUTOLOADS a pytest plugin that
# imports `_pytest.scope` -- added in pytest 7. A bare `pytest` then dies during
# plugin load with `ModuleNotFoundError: No module named '_pytest.scope'` before
# collecting a single test, which reads like a broken workspace rather than a
# plugin clash. Disabled rather than pinned: nothing here uses anyio's fixtures,
# and `-p no:<name>` is a no-op when the plugin is absent.
addopts = -p no:anyio

# testpaths keeps collection off the colcon `install/` trees, which otherwise get
# imported INSTEAD of the sources -- a worktree resolves them to the main
# workspace's stale copy, so a test can silently referee code that is not the
# code under edit.
#
# `src` holds the six packages' own test/ folders; `test` holds the repo-wide
# guards (import hygiene, reachability, the retired stack). Nothing else is
# collected: naming the paths keeps a stray scratch file out of the run.
testpaths = src test
python_files = test_*.py
