[pytest]
# ROS Humble ships pytest 6.2.5 from apt. The simulator's FastAPI dependency
# (sim/requirements.txt) pulls pip `anyio`, whose pytest plugin AUTOLOADS and
# imports `_pytest.scope` -- added in pytest 7. The result is that installing the
# sim deps makes every autonomy test run die during collection with
# `ModuleNotFoundError: No module named '_pytest.scope'`, which reads like a
# broken workspace rather than a plugin clash.
#
# Disabling the autoload here rather than pinning anyio: FastAPI requires
# anyio>=3.4, so a pin fights the dependency resolver, and nothing in this
# workspace uses anyio's pytest fixtures. `-p no:<name>` is a no-op when the
# plugin is absent, so this is safe on a box without the sim deps.
addopts = -p no:anyio
