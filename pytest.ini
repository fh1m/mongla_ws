[pytest]
# `-p no:anyio` is not a preference. The system pytest here is 6.2.5 and the
# installed anyio plugin imports `_pytest.scope`, which does not exist until
# pytest 7 -- so a bare `pytest` dies during plugin load with
# `ModuleNotFoundError: No module named '_pytest.scope'` before collecting a
# single test. Every round has re-discovered this and passed the flag by hand.
addopts = -p no:anyio
testpaths = src test
python_files = test_*.py
