# Kutum: Ethernet and Wi-Fi may sit on one network. Each interface answers
# ARP only for its own address (arp_ignore=1) and names its own address when
# it asks (arp_announce=2), so a neighbour never learns the Wi-Fi address at
# the Ethernet card. The routing half is 50-kutum-source-routes.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
