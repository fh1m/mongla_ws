# The manager streams commands to the board at 50 Hz and asks for SCHED_FIFO 10
# (mongla_localization/realtime.py). Without this the kernel refuses, and its
# worst wake-up under load is about 3 ms instead of 0.6 ms (measured-bars 76).
# The ceiling is 20: under the kernel's interrupt threads at 50. It is granted
# to the group the vehicle user is already in for the board's serial port.
@dialout  -  rtprio  20
