# Single source of truth for RoboSub 2026 arena geometry. One file per
# competition; see spec/sauvc.yaml for the other.
#
# Read by scripts/gen_pool_texture.py, scripts/gen_props.py and
# scripts/gen_world.py. Change a dimension here and re-run
# `scripts/gen_world.py --all` to regenerate textures, prop models and worlds
# together. Nothing downstream hardcodes these numbers.
#
# Dimensions are from the RoboSub 2026 Team Handbook
# (robonation.org/app/uploads/sites/4/2026/07/RoboSub-2026_Team-Handbook_20260711-compressed.pdf)
# and the task descriptions at
# robonation.gitbook.io/robosub-resources/section-3-autonomy-challenge/3.2-task-descriptions
# Page references below are to the handbook. Imperial is the source unit
# throughout; the metric value is the handbook's own conversion.

pool:
  # The handbook gives the DEPTH but not the plan dimensions of the 2026 venue:
  # "The pool is 7 ft (2.1 m) deep, with a 1 ft (0.3 m) drop from the pool deck
  # to the water surface." (p. 72). It also refers to four sections A/B/C/D
  # running simultaneously (p. 102), which is what sets the plan size below.
  #
  # 20 x 12 m is therefore an ASSUMPTION, chosen to hold one section's task set
  # at the spacings the task descriptions give. Depth is the quoted 2.1 m and is
  # the number that matters: it is what every depth-spanning prop is generated
  # against, and it is why this competition cannot share SAUVC's models.
  length: 20.0
  width: 12.0
  depth: 2.1
  wall_thickness: 0.2
  # Water surface sits at z = 0. The floor is therefore at z = -depth.

# Structural PVC radius. Tasks are built from 1/2 in and 3/4 in PVC; 1 in pipe
# is called out for the slalom. Radii are outside-diameter/2 of nominal pipe.
pvc_half_in: 0.0105     # 1/2 in nominal, 21.3 mm OD
pvc_three_quarter_in: 0.0133   # 3/4 in nominal, 26.7 mm OD
pvc_one_in: 0.0167      # 1 in nominal, 33.4 mm OD

# The two role identities. Every task carries a 12 in x 12 in (305 mm) vinyl
# sign for each, and scoring depends on matching the role the vehicle chose at
# the gate. Colours here are for the generated sign textures, not rulebook
# values -- the handbook specifies imagery (compass/hammer-pick, ring-buoy/SOS,
# fire, droplet), not colours.
roles:
  survey_repair:
    sign_colour: [0.85, 0.42, 0.12]      # fire / fire-engine imagery
  search_rescue:
    sign_colour: [0.16, 0.44, 0.78]      # droplet / ambulance imagery

sign:
  # "12 in x 12 in (305 mm x 305 mm)" -- pp. 45, 49, 53.
  size: 0.305
  thickness: 0.004

props:
  gate:
    # "120 in x 60 in (3 m x 1.5 m)" with BLACK and RED panels (p. 45).
    # "The right side features RED on top, BLACK on bottom; left side reverses
    #  this pattern. The divider is RED."
    width: 3.0
    height: 1.5
    # "24 in (610 mm)" -- the divider drop from the top bar.
    divider_drop: 0.610
    # 3 in corrugated boxes form the panels; 2 in flat sheet forms the divider.
    panel_depth: 0.076
    divider_depth: 0.051
    colours:
      red: [0.72, 0.11, 0.13]
      black: [0.07, 0.07, 0.08]

  slalom:
    # "Three sets of vertical 1-inch PVC pipes moored at different heights",
    # "3 ft (0.9m)" tall, arranged WHITE (left), RED (centre), WHITE (right).
    height: 0.9
    # Lateral gap between the pipes of one set. Not stated in the handbook; this
    # is wide enough for the hull plus clearance.
    spacing: 0.6
    colours:
      white: [0.90, 0.90, 0.90]
      red: [0.72, 0.11, 0.13]

  bin:
    # "Four bins (CleverMade Collapsible Milk Crate 25L)" (p. 49). The crate's
    # published external size; the handbook gives the model, not the dimensions.
    length: 0.40
    width: 0.30
    height: 0.27
    wall: 0.012
    colour: [0.18, 0.18, 0.20]
    # "a 3D pipeline made from PVC supported off the bottom of the pool" (p. 47)
    pipeline_height: 0.5

  torpedo_board:
    # "2 ft x 2 ft (0.6m x 0.6m)" with "two different size openings" (p. 51).
    size: 0.6
    thickness: 0.02
    # Opening sizes are not stated numerically; these are the large/small pair
    # the scoring distinguishes ("larger opening first, then smaller").
    large_opening: 0.20
    small_opening: 0.13
    colour: [0.88, 0.86, 0.80]
    # Scoring standoffs: "far (1 ft, 0.3m) and farther (1.5 ft, 0.46m)" (p. 50).
    standoff_far: 0.30
    standoff_farther: 0.46

  octagon:
    # "A 9 ft (2.7m) diameter octagon floats on the surface" (p. 52).
    diameter: 2.7
    pipe_radius: 0.0105          # 1/2 in PVC
    colour: [0.92, 0.92, 0.92]
    # "Resupply table (1/2 in PVC, 2 ft x 2 ft)".
    table_size: 0.6
    table_height: 0.5

  collectible:
    # "cylindrical jars (2.76" dia x 1.97" tall)" and
    # "box containers (3.3 x 3.3 x 1.2")".
    jar_diameter: 0.070
    jar_height: 0.050
    box_size: 0.084
    box_height: 0.030
    colours:
      bolt: [0.55, 0.55, 0.58]
      plug: [0.80, 0.65, 0.25]
      pill: [0.90, 0.90, 0.92]
      bandage: [0.93, 0.85, 0.70]

  path_marker:
    # "~4 feet (~1.2m) long by 6 in (15 cm) wide. The Path is colored ORANGE."
    length: 1.2
    width: 0.15
    colour: [0.95, 0.42, 0.05]

  pinger:
    # "The pinger model selected for use is the Benthos ALP-365 ... user
    #  selectable from 25 to 40 kHz in 0.5 kHz increments" with pulse rate
    #  "0.5 Hz to 2 Hz" (pp. 100-101). Two pingers, one at Deploy (Torpedoes)
    #  and one at Restore (Octagon), "each active pinger is separated by at
    #  least 2 kHz".
    #
    # Geometry is a placeholder body so the thing can be seen and placed; the
    # acoustics live in the hydrophone model, not here.
    height: 0.12
    radius: 0.035
    colour: [0.15, 0.15, 0.17]
    freq_khz_min: 25.0
    freq_khz_max: 40.0
    freq_khz_step: 0.5
    pulse_hz_min: 0.5
    pulse_hz_max: 2.0

texture_px_per_m: 64
