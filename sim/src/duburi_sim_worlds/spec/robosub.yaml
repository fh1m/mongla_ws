# Single source of truth for RoboSub 2026 arena geometry. One file per
# competition; see spec/sauvc.yaml for the other.
#
# Read by scripts/gen_pool_texture.py, scripts/gen_props.py and
# scripts/gen_world.py. Change a dimension here and re-run
# `scripts/gen_world.py --all` to regenerate textures, prop models and worlds
# together. Nothing downstream hardcodes these numbers.
#
# Dimensions are from the RoboSub 2026 Team Handbook
# (robonation.org/app/uploads/sites/4/2026/07/RoboSub-2026_Team-Handbook_20260711-compressed.pdf)
# and the task descriptions at
# robonation.gitbook.io/robosub-resources/section-3-autonomy-challenge/3.2-task-descriptions
# Page references below are to the handbook. Imperial is the source unit
# throughout; the metric value is the handbook's own conversion.

pool:
  # The handbook gives the DEPTH but not the plan dimensions of the 2026 venue:
  # "The pool is 7 ft (2.1 m) deep, with a 1 ft (0.3 m) drop from the pool deck
  # to the water surface." (p. 72). It also refers to four sections A/B/C/D
  # running simultaneously (p. 102), which is what sets the plan size below.
  #
  # 20 x 12 m is therefore an ASSUMPTION, chosen to hold one section's task set
  # at the spacings the task descriptions give. Depth is the quoted 2.1 m and is
  # the number that matters: it is what every depth-spanning prop is generated
  # against, and it is why this competition cannot share SAUVC's models.
  length: 20.0
  width: 12.0
  depth: 2.1
  wall_thickness: 0.2
  # Water surface sits at z = 0. The floor is therefore at z = -depth.

# Structural PVC radius. Tasks are built from 1/2 in and 3/4 in PVC; 1 in pipe
# is called out for the slalom. Radii are outside-diameter/2 of nominal pipe.
pvc_half_in: 0.0105     # 1/2 in nominal, 21.3 mm OD
pvc_three_quarter_in: 0.0133   # 3/4 in nominal, 26.7 mm OD
pvc_one_in: 0.0167      # 1 in nominal, 33.4 mm OD

# The two role identities. Every task carries a 12 in x 12 in (305 mm) vinyl
# sign for each, and scoring depends on matching the role the vehicle chose at
# the gate. Colours here are for the generated sign textures, not rulebook
# values -- the handbook specifies imagery (compass/hammer-pick, ring-buoy/SOS,
# fire, droplet), not colours.
# The role images are RENDERED FROM THE ACTUAL EMOJI RoboNation prints, by
# gen_pool_texture.make_role_image, into models/robosub_textures/role_*.png.
# The colours below are only the fallback if the emoji font is missing.
roles:
  survey_repair:
    sign_colour: [0.85, 0.42, 0.12]
    gate_images: [compass, hammer_pick]
    # `task_image` is the single bin symbol. `task_images` is the 2026 torpedo
    # PAIR -- the board carries a role's symbol AND its vehicle.
    task_image: fire
    task_images: [fire, fire_engine]
  search_rescue:
    sign_colour: [0.16, 0.44, 0.78]
    gate_images: [sos, ring_buoy]
    task_image: droplet
    task_images: [droplet, ambulance]

sign:
  # "12 in x 12 in (305 mm x 305 mm)" -- pp. 45, 49, 53.
  size: 0.305
  thickness: 0.004

props:
  gate:
    # "120 in x 60 in (3 m x 1.5 m)" with BLACK and RED panels (p. 45).
    # "The right side features RED on top, BLACK on bottom; left side reverses
    #  this pattern. The divider is RED."
    width: 3.0
    height: 1.5
    # "floating just below the surface and moored to the bottom" (p. 32). The
    # handbook does not put a number on "just below", so this is ours: deep
    # enough that the top bar is properly submerged, shallow enough that the
    # clear water beneath the frame is the 0.5 m the task implies.
    submergence: 0.1
    # "24 in (610 mm)" -- the divider drop from the top bar.
    divider_drop: 0.6096
    divider_width: 0.0508
    # Each leg carries two 24 in colour bands.
    band_length: 0.6096
    # 3 in corrugated boxes form the panels; 2 in flat sheet forms the divider.
    panel_depth: 0.076
    divider_depth: 0.051
    colours:
      red: [0.72, 0.11, 0.13]
      black: [0.07, 0.07, 0.08]

  slalom:
    # "Three sets of vertical 1-inch PVC pipes moored at different heights",
    # "3 ft (0.9m)" tall, arranged WHITE (left), RED (centre), WHITE (right).
    height: 0.9
    # Lateral gap between the pipes of one set. Not stated in the handbook; this
    # is wide enough for the hull plus clearance.
    spacing: 0.6
    colours:
      white: [0.90, 0.90, 0.90]
      red: [0.72, 0.11, 0.13]

  bin:
    # CleverMade Collapsible Milk Crate 25L. The TeamTime slide gives the exact
    # size the handbook omits: 13.2" x 13.2" x 11" (33.5 x 33.5 x 28 cm). It is
    # SQUARE in plan -- the 0.40 x 0.30 used before was invented.
    length: 0.335
    width: 0.335
    height: 0.28
    wall: 0.012
    # The moulded lattice. Bars are geometry, not an alpha texture -- SDF has no
    # element for alpha-cutout, so a see-through wall has to be built.
    # How far the role placard stands off its crate face. It used to be tucked
    # 0.04 m in front of the crate at nearly the crate's own width, so it read
    # as the crate's front panel rather than as a separate sign.
    lattice_cols: 5
    lattice_rows: 4
    lattice_bar: 0.022
    colour: [0.18, 0.18, 0.20]
    # "3D pipeline made from PVC supported off the bottom of the pool", and
    # "four bins hang off the SIDES of the pipeline" -- two Survey & Repair,
    # two Search & Rescue. The bins are not free-standing on the floor.
    pipeline_height: 0.55
    pipeline_span: 1.30
    # 12x12 in role panels stand on the pipework beside the crates.
    panel_height: 0.85

  torpedo_board:
    # "2 ft x 2 ft (0.6m x 0.6m)" with "two different size openings" (p. 51).
    size: 0.6
    thickness: 0.02
    # Opening sizes are not stated numerically; these are the large/small pair
    # the scoring distinguishes ("larger opening first, then smaller").
    # Sizes are NOT stated numerically anywhere in the handbook. These are read
    # off the CAD's proportions -- the large ring is about a quarter of the
    # board's width and the small about a sixth. The previous 0.20/0.13 made the
    # openings a third of the board, which crowded out the printed images and is
    # visibly wider than the drawing. A torpedo is 51 mm square, so 0.14 m is
    # still nearly three times the round.
    # How far back the rear kickstand feet land from the frame.
    brace_rake: 0.45
    # Wired at last: this had been read with a .get() default of 0.55 while the
    # spec never carried it, so the value here was doing nothing.
    leg_height: 0.55
    large_opening: 0.14
    small_opening: 0.095
    # LAYOUT -- 2026. The TeamTime "Task 4 - Deploy (Torpedoes)" slide and the
    # CAD both show a board of FOUR openings and FOUR role images, arranged in
    # two rows with the images alternating with the rings.
    #
    # ONLY THE ORDER IS DECLARED HERE. The column POSITIONS are packed by
    # prop_library.torpedo_layout() from the radii below, and that is the whole
    # point: the previous version hand-picked four column centres 0.235 apart
    # while a large ring's outer radius (0.157) plus an image's half-width
    # (0.105) needs 0.262. An overlap was guaranteed by arithmetic the moment
    # those numbers were chosen, and the large ring ran 0.006 off the board
    # edge. Nothing checked it. Now nothing can drift: change a radius and the
    # packing moves with it, and test_torpedo_board.py fails on any overlap.
    #
    # The two board versions differ only in which image sits beside the LARGE
    # opening, so a detector cannot read the role from image presence alone.
    rows:
      - z:  0.44
        slots: [image, large, image, small]
      - z: -0.44
        slots: [image, small, image, large]
    # Ring outer radius as a multiple of the opening radius. Was 1.34 -- a third
    # of the ring's own radius in thickness, which rendered as a thick brown
    # annulus where the CAD draws a thin bright red circle. Narrowing it is also
    # what buys the space the four columns need.
    ring_band: 1.10
    # METRES, and the key was renamed to say so. It used to be `image_size` and
    # meant a FRACTION of the texture (the one reader was `px * image_size`).
    # The packer works in metres like every other length here, and a key whose
    # unit changed under its old name is the same silent-drift bug this round
    # exists to kill -- so the name changed with it.
    image_size_m: 0.10
    # Keep every element clear of the frame. The uprights sit at +-size/2 with
    # radius pvc_one_in = 0.0167, so the panel's clear half-width is 0.2833 and
    # a 0.04 inset stands 23 mm off the tube. Chosen from the frame, not from
    # what happens to make the row fit.
    inset: 0.04
    # Cool mid-grey, matching the CAD. Was [0.88,0.86,0.80] -- a warm off-white
    # that had never been read by any code, so nothing revealed it was wrong
    # until the panel started using it.
    colour: [0.56, 0.57, 0.59]
    # SCORING STANDOFFS -- THE TWO SOURCES DISAGREE, so both are recorded.
    #   Handbook p. 50:      far 1 ft (0.3 m),  farther 1.5 ft (0.46 m)
    #   TeamTime-2 slide:    far 1.0 m,         farther 1.5 m
    # The slide is the later document and its numbers are the ones a mission
    # should be tuned against, so they are the active pair. If a rules update
    # settles it the other way, swap these two lines and say so here.
    standoff_far: 1.00
    standoff_farther: 1.50
    standoff_far_handbook: 0.30
    standoff_farther_handbook: 0.46

  octagon:
    # "A 9 ft (2.7m) diameter octagon floats on the surface" (p. 52).
    diameter: 2.7
    pipe_radius: 0.0105          # 1/2 in PVC
    colour: [0.92, 0.92, 0.92]
    # "Resupply table (1/2 in PVC, 2 ft x 2 ft)".
    table_size: 0.6
    table_height: 0.5

  collectible:
    # "cylindrical jars (2.76" dia x 1.97" tall)" and
    # "box containers (3.3 x 3.3 x 1.2")".
    jar_diameter: 0.070
    jar_height: 0.050
    box_size: 0.084
    box_height: 0.030
    # Slightly denser than water so the items REST on the table instead of
    # floating off it. At the old flat 0.15 kg every one was positively
    # buoyant. See robosub_collectible.
    density: 1150.0
    colours:
      bolt: [0.55, 0.55, 0.58]
      plug: [0.80, 0.65, 0.25]
      pill: [0.90, 0.90, 0.92]
      bandage: [0.93, 0.85, 0.70]

  path_marker:
    # "~4 feet (~1.2m) long by 6 in (15 cm) wide. The Path is colored ORANGE."
    # The CAD shows it as TWO 18 in (457.2 mm) segments on PVC T-stands, held
    # OFF the bottom -- not a decal painted on the floor.
    segment_length: 0.4572
    segments: 2
    width: 0.1524
    thickness: 0.02
    stand_height: 0.30
    colour: [0.95, 0.42, 0.05]

  pinger:
    # "The pinger model selected for use is the Benthos ALP-365 ... user
    #  selectable from 25 to 40 kHz in 0.5 kHz increments" with pulse rate
    #  "0.5 Hz to 2 Hz" (pp. 100-101). Two pingers, one at Deploy (Torpedoes)
    #  and one at Restore (Octagon), "each active pinger is separated by at
    #  least 2 kHz".
    #
    # Geometry is a placeholder body so the thing can be seen and placed; the
    # acoustics live in the hydrophone model, not here.
    height: 0.12
    radius: 0.035
    colour: [0.15, 0.15, 0.17]
    freq_khz_min: 25.0
    freq_khz_max: 40.0
    freq_khz_step: 0.5
    pulse_hz_min: 0.5
    pulse_hz_max: 2.0

texture_px_per_m: 64
