name: task_target_acquisition
description: >
  Target Acquisition in isolation: the four-drum target zone only.

  One blue drum and three red, one red carrying the pinger, per the rulebook.
  Their left-to-right order is randomised at competition -- this is one legal
  arrangement. Re-roll it live with:
    ros2 run duburi_sim_scenarios props move drum_a <x> <y>

  Deliberately clearer water than the final course: this task is flown looking
  DOWN at short range, so the fog matters far less than it does for the gate.

pool: sauvc

scene:
  lighting: competition
  # fog_* is inert on gz-sim 8; `lighting:` above is the real lever
  fog_start: 2.0
  fog_end: 20.0
  fog_density: 0.02

vehicle:
  model: duburi_heavy
  name: duburi
  pose: [4.0, 0.0, -0.4]
  yaw: 0.0

props:
  # Rulebook Figure 16: the four drums stand in a LINE, equally spaced, on a
  # green mat. They were previously staggered diagonally, which is not what any
  # competition photo shows and makes the bottom-camera search unrepresentative.
  #
  # 1.2 m pitch: the drums are 0.6 m across, so this leaves a clear drum-width
  # between them. Close enough that two can appear in one bottom-camera frame at
  # working altitude, which is the case the detector actually has to handle.
  - model: sauvc_target_mat
    name: target_mat
    xy: [9.0, 0.0]
    yaw: 1.5708

  - model: sauvc_drum_red
    name: drum_a
    xy: [9.0, 2.4]
  - model: sauvc_drum_blue
    name: drum_b
    xy: [9.0, 0.8]
  - model: sauvc_drum_red_pinger
    name: drum_c
    xy: [9.0, -0.8]
  - model: sauvc_drum_red
    name: drum_d
    xy: [9.0, -2.4]
