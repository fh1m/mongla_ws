# Duburi 4.5 simulator proxy, built on the BlueROV2 Heavy hull.
#
# Edit this file and re-run scripts/generate_model.py; never hand-edit model.sdf.
# In particular the buoyancy collision box is derived from mass, bounding_box,
# buoyancy_adjustment and fluid_density, so changing any of those without
# regenerating leaves the model silently mis-weighted.

model_name: "duburi_heavy"

# BlueROV2 Heavy in its stock configuration, per the identified model in
# HYDRODYNAMICS.md. Note this is 13.5, not the 13.0 bluerov2_gz uses.
mass: 13.5

# MUST match the world's gz-sim-buoyancy-system <default_density>. The upstream
# bluerov2 model gets this wrong (998 here vs 1000 in the world) and ends up
# with a displacement it did not intend.
fluid_density: 1000.0

control_method: 0  # 0 = thrust (cmd_thrust), 1 = angular velocity (cmd_vel)

# Note the width exceeds the length; that is the eight-thruster Heavy frame,
# not a transposition. Only x and y feed the buoyancy collision box - z is used
# solely for the fallback drag and inertia estimates, which we override below.
bounding_box:
  x: 0.457
  y: 0.575
  z: 0.378

center_of_mass:
  x: 0.0
  y: 0.0
  z: 0.0

# 1 cm above the centre of mass. This separation is the vehicle's entire passive
# righting moment in roll and pitch, and it comes from the same identified model
# as the hydrodynamic coefficients. bluerov2_gz uses 4.9 cm, which is much
# stiffer than the real vehicle.
center_of_volume:
  x: 0.0
  y: 0.0
  z: 0.01

# The identified model is exactly neutral (13.5 kg displacing 0.0135 m^3). Add a
# little so the vehicle surfaces on loss of control, matching how the real
# Duburi is ballasted.
buoyancy_adjustment: 0.1

inertia:
  ixx: 0.26
  iyy: 0.23
  izz: 0.37

# Order matters: it must match the thrusterN link declarations in model.sdf.in.
# 1-4 are the vectored horizontals, 5-8 the verticals.
thrusters:
  - x: 0.14    # Thruster 1, front starboard vectored
    y: -0.092
    z: 0.0
  - x: 0.14    # Thruster 2, front port vectored
    y: 0.092
    z: 0.0
  - x: -0.14   # Thruster 3, aft starboard vectored
    y: -0.092
    z: 0.0
  - x: -0.14   # Thruster 4, aft port vectored
    y: 0.092
    z: 0.0
  - x: 0.118   # Thruster 5, front starboard vertical
    y: -0.215
    z: 0.064
  - x: 0.118   # Thruster 6, front port vertical
    y: 0.215
    z: 0.064
  - x: -0.118  # Thruster 7, aft starboard vertical
    y: -0.215
    z: 0.064
  - x: -0.118  # Thruster 8, aft port vertical
    y: 0.215
    z: 0.064

# --- Fossen hydrodynamic coefficients ---------------------------------------
#
# From the ROV-Simulator benchmark's identified BlueROV2 Heavy model. Full
# provenance, units and the sign derivation are in HYDRODYNAMICS.md; read that
# before touching any number here.
# THE TWO BLOCKS BELOW HAVE OPPOSITE SIGN CONVENTIONS. This is not a typo.
#
# `drag` feeds the Hydrodynamics plugin, which negates twice, so the force it
# applies is +xU*u. Damping coefficients must therefore be negative to oppose
# motion; a positive one gives a vehicle that accelerates itself.
#
# `added_mass` does NOT feed that plugin. It is emitted as the link's
# <fluid_added_mass> matrix, which is a real inertia and so is positive.
# generate_model.py rejects negative values here. The reason for the split is
# stability, and it is covered in HYDRODYNAMICS.md; the short version is that
# heave adds 18.7 kg to a 13.5 kg vehicle, and the plugin's explicit treatment
# of that diverges within a second of sim time.

added_mass:
  xDotU: 6.356674      # kg
  yDotV: 7.120600      # kg
  zDotW: 18.686327     # kg
  # The rotational added-mass terms carry 30-100% estimation error in the source
  # (the empirical method it uses assumes length exceeds width, and the Heavy is
  # 20% wider than it is long). Treat these three as soft.
  kDotP: 0.185766      # kg*m^2
  mDotQ: 0.134823      # kg*m^2
  nDotR: 0.221510      # kg*m^2

drag:
  # First-order damping. Sway, roll and yaw really are zero in the source: those
  # axes are modelled as purely quadratically damped. This is not missing data.
  linear:
    xU: -13.7          # N*s/m
    yV: 0.0
    zW: -33.0          # N*s/m
    kP: 0.0
    mQ: -0.8           # N*m*s/rad
    nR: 0.0

  # Second-order damping. These replace the flat-plate estimates the generator
  # would otherwise derive from the bounding box, which understate drag badly:
  # they predict a 1.56 m/s top speed against Blue Robotics' published ~1.0 m/s.
  # These values give 0.95 m/s.
  quadratic:
    xUabsU: -141.0     # N*s^2/m^2
    yVabsV: -217.0     # N*s^2/m^2
    zWabsW: -190.0     # N*s^2/m^2
    kPabsP: -1.192     # N*m*s^2/rad^2
    mQabsQ: -0.47      # N*m*s^2/rad^2
    nRabsR: -1.5       # N*m*s^2/rad^2

# 640x480 is fixed by the sim_front / sim_bottom profiles in
# duburi_vision/config/cameras.yaml. far_clip stands in for water turbidity.
cameras:
  width: 640
  height: 480
  update_rate: 30.0
  # 1.0064 rad = 57.7 deg, the UNDERWATER field of view.
  #
  # The Blue Robotics Low-Light HD USB camera is specified at 80 deg
  # horizontal IN AIR, and 80 deg is what this was set to. But the camera
  # looks through a flat port into water, and Snell's law narrows it:
  #     theta_water = 2 * asin(sin(40 deg) / 1.333) = 57.7 deg
  # -- 28 % narrower than the number on the datasheet.
  #
  # That gap runs the wrong way for us. A sim camera that sees 80 deg shows
  # more of the course than the vehicle ever will, so a mission tuned here
  # keeps targets in frame that the real hull would have lost off the edge,
  # and every search pattern is calibrated against a view that does not
  # exist. This is the single most consequential number for vision work in
  # the whole model.
  hfov: 1.0064
  far_clip: 30.0
  noise_stddev: 0.007
  front:
    x: 0.2
    y: 0.0
    z: 0.0
  bottom:
    x: 0.0
    y: 0.0
    z: -0.1

ardupilot:
  fdm_addr: "127.0.0.1"
  fdm_port_in: 9002

# Per-pixel light attenuation needs a depth image per camera. Each costs a
# full render pass on the thread the colour cameras share, so this is OFF by
# default and turned on for a perception experiment. underwater_fx falls back
# to uniform attenuation by vehicle depth when no range image arrives.
#
# THE COST IS MEASURED, NOT ESTIMATED: the cameras go from 12 Hz to 4 Hz with
# that claim is RETRACTED -- see the measurements below. The third of the frame
# rate was the price of a second FULL-RESOLUTION render pass, not the price of
# per-pixel attenuation, and the two are separable.
# Per-pixel attenuation. `false`, or a block giving the depth cameras their OWN
# resolution and rate -- which is the point: they used to mirror the colour
# cameras exactly (640x480 @ 30 Hz) and that is what cost 12 Hz -> 4 Hz.
# Attenuation is a smooth, low-frequency correction and nothing reads the range
# image sharp, so it can be far cheaper than the image it corrects.
#
# MEASURED, camera Hz on robosub26_full:
#
#     off (baseline)        7.740 Hz     --
#     640x480 @ 30          6.468 Hz     -16 %   (the old mirror-the-colour-
#                                                 camera setting)
#     320x240 @ 10          7.674 Hz     -0.9 %  <- default
#     160x120 @  5          7.543 Hz     -2.5 %
#
# So per-pixel attenuation is essentially FREE once the depth cameras stop
# mirroring the colour cameras, and it is on by default. The two cheap points
# are within noise of each other and of the baseline; 320x240 is chosen over
# 160x120 for the better range image at the same price, not because it measured
# faster -- that difference is noise and should not be read as a result.
#
# This retires the "12 Hz -> 4 Hz, set it deliberately per session" trade: the
# cost was never per-pixel attenuation, it was rendering a second 640x480 @ 30
# pass for a correction that is smooth and low-frequency.
range_cameras:
  width: 320
  height: 240
  update_rate: 10.0

# ---------------------------------------------------------------- livery ----
# THE HULL IS OURS, NOT A STOCK BlueROV2.
#
# The visual is a BlueROV2 Heavy mesh (MIT, from bluerov2_gz) and it carried the
# vendor's own colours, so every render and every operator view showed somebody
# else's vehicle. Duburi 4.5 is an octagonal Marine 5083 ALUMINIUM hull, which
# is what these numbers describe: a brushed-aluminium body rather than the
# stock black polymer, with the team's accent on the thrusters so the eight
# vectored units read apart from the frame at a glance.
#
# An SDF <material> overrides the mesh's embedded material, so this needs no
# mesh edit and stays a config change.
#
# It is DELIBERATELY not a detection concern: the vehicle is semantic label 0
# (background) and is never a target, so no dataset changes with this. It is an
# operator-view and RViz change, and it is worth saying that plainly rather than
# implying a realism gain that is not there.
livery:
  # Brushed 5083 aluminium, WARM. A neutral grey here is a no-op: the
  # recolour preserves luminance, so tinting the mesh's greys toward
  # another grey returns them unchanged (measured: 2.2 % of pixels).
  # The warmth is what makes the frame read as machined metal.
  hull: [0.70, 0.66, 0.58]
  hull_specular: 0.42
  # Anodised deep teal on the thruster housings.
  thruster: [0.09, 0.26, 0.30]
  thruster_specular: 0.30
  # Self-illumination, for the same reason every prop has it: an underwater
  # scene is fogged and singly lit, and without it the hull reads near-black in
  # the operator view. Applied PER CHANNEL -- a grey emissive is a desaturation
  # term, which is what washed out every coloured prop before round 12.
  emissive_gain: 0.22

# --------------------------------------------------------------- gripper ----
# OFF BY DEFAULT. Turning it on changes the vehicle's weight and trim, so it is
# opt-in and every consequence below is stated rather than discovered.
#
# Modelled on the Blue Robotics Newton Subsea Gripper, from its published
# specification -- there is no public URDF or Gazebo model of it (Blue
# Robotics' own forum, May 2024), so this is authored from the datasheet the
# way every prop in this tree is authored from published figures:
#
#     jaw opening      62 mm
#     length           303.2 mm closed / 309.2 mm open
#     body diameter    36 mm
#     mass             524 g in air, 267 g submerged
#     actuation        1.6 s open-to-close, PWM 1100-1900 (1500 neutral)
#     grip force       97 N at the tip, 124 N mid-jaw
#
# WHAT THIS DOES NOT DO: it does not make the octagon's object-handling points
# scorable. Those stay NOT_MODELLED in rulebook.py (5,100 RoboSub points, 60
# SAUVC) because no autonomy verb commands it -- a mission cannot grab. This is
# geometry, mass and a grasp mechanic to develop against, not a scoring change.
gripper:
  enabled: false
  # On the hull's underside front, jaws forward -- where a Newton mounts.
  x: 0.24
  y: 0.0
  z: -0.09
  body_radius: 0.018        # 36 mm diameter
  body_length: 0.20         # the visible body; the datasheet 303 mm includes
                            # the jaws, which are separate links below
  jaw_length: 0.10
  jaw_radius: 0.008
  # Half the 62 mm opening, as a hinge angle each jaw swings through.
  jaw_open_rad: 0.62
  # The datasheet's full-travel time. The controller is rate-limited to it, so
  # a grab takes as long in the sim as it does on the vehicle.
  actuation_s: 1.6
  mass: 0.524               # in AIR. The submerged 267 g follows from the
                            # displacement below and is not typed twice.
  # THE TRAP THIS EXISTS FOR. The buoyancy collision box is DERIVED:
  #     collision_z = (mass + buoyancy_adjustment) / (bx * by * fluid_density)
  # so adding 524 g of gripper without adding displacement makes the vehicle
  # sink. The gripper displaces 524 - 267 = 257 g of water, which still leaves
  # it 267 g negative -- correctly, because a Newton IS negatively buoyant.
  #
  # A real team trims that out with foam, and so does this: `trim_kg` restores
  # the hull's original +0.1 kg net buoyancy so the flight model does not
  # silently change under the vision work. Set it to 0.0 to fly the untrimmed
  # vehicle and watch it sink, which is also a legitimate thing to want.
  displacement: 0.257
  trim_kg: 0.267

odom_publish_frequency: 50.0

# SUN GLARE on the cameras. `false`, or a block:
#
#   lens_flare:
#     scale: 0.4
#     colour: [1.0, 0.95, 0.85]
#
# OFF BY DEFAULT, deliberately. Glare is a real condition to train against AND a
# real way to make a dataset harder than the pool it came from, so it is a
# stated choice per session rather than something that quietly appears in every
# capture.
#
# IT IS A CONFIG SETTING, NOT A LAUNCH ARG, and that is a property of the
# architecture rather than an oversight: model.sdf is a BUILD ARTIFACT generated
# from this file, so nothing at launch time can add a plugin to it. Same as
# `range_cameras`. To enable:
#
#     edit this block, then
#     scripts/generate_model.py models/<vehicle>/model.sdf.in \
#         models/<vehicle>/model.sdf models/<vehicle>/configs.yaml
#     ./build_sim.sh --packages-select duburi_sim_description
#
# (the SDF/URDF drift guard fails the test suite if you edit this and forget.)
lens_flare: false
