<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Mongla</title>
<meta name="description" content="{{ page.description }}">
<meta name="theme-color" content="#000000">
<!-- one stylesheet for the whole site: the palette lives in exactly one file -->
<link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" sizes="any">
<link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
<style>
/* the prose layer — everything else is inherited from site.css */
body.doc main{margin-inline:auto;max-width:74ch;padding:clamp(40px,6vh,76px) var(--gutter) clamp(72px,10vh,120px)}
.topbar{position:sticky;top:0;z-index:30;border-bottom:1px solid var(--rule);background:#000}
@supports (backdrop-filter:blur(8px)){
  .topbar{background:rgba(0,0,0,.82);backdrop-filter:blur(8px)}}
.topbar .bar{max-width:74ch;margin:0 auto;padding:0 var(--gutter);height:56px;
  display:flex;align-items:center;gap:22px}
.topbar .home{font-family:var(--display);font-weight:700;letter-spacing:-.02em;
  font-size:17px;border:0;color:var(--ink)}
.topbar .home::before{content:"";display:inline-block;width:7px;height:7px;
  background:var(--signal);margin-right:9px;vertical-align:2px}
.topbar .home:hover{color:#fff}
.topbar nav{margin-left:auto;display:flex;gap:18px;font-family:var(--data);
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase}
.topbar nav a{border:0;color:var(--ink-3)}
.topbar nav a:hover{color:var(--red-lit)}

body.doc h1{font-size:clamp(2.1rem,1rem + 3.6vw,3.6rem);margin-bottom:var(--s2)}
body.doc h1 + p{font-size:clamp(1.05rem,1rem + .4vw,1.3rem);color:var(--ink-2);line-height:1.52}
body.doc h2{font-size:clamp(1.4rem,1rem + 1.5vw,2.05rem);margin:var(--s6) 0 var(--s2);
  padding-top:var(--s3);border-top:1px solid var(--rule);scroll-margin-top:74px}
body.doc h3{font-size:1.06rem;margin:var(--s5) 0 var(--s1);color:#fff}
body.doc p{margin:0 0 var(--s3)}
body.doc ul,body.doc ol{margin:0 0 var(--s3);padding-left:1.15em}
body.doc li{margin-bottom:7px}
body.doc li::marker{color:var(--signal)}
body.doc blockquote{margin:var(--s4) 0;padding-left:20px;border-left:1px solid var(--signal);
  color:var(--ink-2);font-style:italic}
body.doc hr{border:0;border-top:1px solid var(--rule);margin:var(--s6) 0}
/* a rule immediately before a heading would draw the line twice */
body.doc hr + h2{border-top:0;padding-top:0;margin-top:0}
body.doc img{width:100%;height:auto;display:block;margin:var(--s4) 0;
  border:1px solid var(--rule);background:var(--s-sunk)}
body.doc code{background:var(--s-sunk);border:1px solid var(--rule);padding:1px 5px}
body.doc pre{margin:var(--s4) 0}
body.doc pre code{background:none;border:0;padding:0;color:inherit}
/* a six-column table squeezed into 74ch is unreadable: scroll it instead */
body.doc .tw{margin:var(--s4) 0;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--rule-lit) transparent}
body.doc .tw::-webkit-scrollbar{height:6px}
body.doc .tw::-webkit-scrollbar-thumb{background:var(--rule-lit);border-radius:3px}
body.doc table{border-collapse:collapse;font-family:var(--data);font-size:12.5px;
  min-width:100%;width:max-content;max-width:none}
body.doc th{text-align:left;font-weight:400;font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);padding:0 14px 10px 0;
  border-bottom:1px solid var(--rule-lit);white-space:nowrap}
body.doc td{padding:11px 14px 11px 0;border-bottom:1px solid var(--rule);
  color:var(--ink-2);vertical-align:top}
body.doc td:first-child{color:#fff}
body.doc strong{color:#fff}

body.doc footer{margin-left:0;max-width:74ch;margin-inline:auto;display:flex;gap:20px;flex-wrap:wrap}
</style>
</head>
<body class="doc">
<header class="topbar"><div class="bar">
  <a class="home" href="{{ '/' | relative_url }}">Mongla</a>
  <nav>
    <a href="{{ '/the-shift.html' | relative_url }}">The shift</a>
    <a href="{{ '/capability-map.html' | relative_url }}">Capabilities</a>
    <a href="https://github.com/fh1m/mongla_ws">Source</a>
  </nav>
</div></header>

<main>{{ content }}</main>

<footer>
  <span>Muhammad Fahim Faisal · Dhaka</span>
  <span>Firmware &amp; hardware: Rakibul Islam</span>
  <span>MIT</span>
</footer>
</body>
</html>
