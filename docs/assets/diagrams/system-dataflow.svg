<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 780" width="1160" height="780" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a0e"/><stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#81a8f1"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30ddc9"/>
    </marker>
  </defs>
  <rect width="1160" height="780" fill="url(#bg3)"/>

  <text x="40" y="50" fill="#a3c0f5" font-size="25" font-weight="700">One frame's journey: camera to thruster</text>
  <text x="40" y="76" fill="#6293ee" font-size="14">Perception and mission thinking happen on the Pi. Every control loop happens on the board. The cable between them carries intent, not reflexes.</text>

  <rect x="40" y="104" width="1080" height="264" rx="14" fill="#090c11" stroke="#1245a4"/>
  <rect x="40" y="104" width="1080" height="34" rx="14" fill="#0b0e14"/>
  <rect x="40" y="124" width="1080" height="14" fill="#0b0e14"/>
  <text x="60" y="128" fill="#8aaef2" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">RASPBERRY PI 5 + HAILO-8 — ROS 2, perception, localization, mission</text>

  <rect x="62" y="156" width="150" height="88" rx="9" fill="#0b0e15" stroke="#11429c"/>
  <text x="76" y="180" fill="#a3c0f5" font-size="13" font-weight="700">Cameras</text>
  <text x="76" y="201" fill="#5f91ed" font-size="11.5">forward + downward</text>
  <text x="76" y="218" fill="#5f91ed" font-size="11.5">newest frame wins;</text>
  <text x="76" y="234" fill="#5f91ed" font-size="11.5">stale ones are dropped</text>

  <rect x="238" y="156" width="164" height="88" rx="9" fill="#0a0d13" stroke="#602cbb"/>
  <text x="252" y="180" fill="#a3c0f5" font-size="13" font-weight="700">Hailo-8 detector</text>
  <text x="252" y="201" fill="#c4acec" font-size="11.5">boxes, masks, classes</text>
  <text x="252" y="218" fill="#c4acec" font-size="11.5">a dedicated chip, so</text>
  <text x="252" y="234" fill="#c4acec" font-size="11.5">the CPU stays free</text>

  <rect x="428" y="156" width="164" height="88" rx="9" fill="#0a0d13" stroke="#602cbb"/>
  <text x="442" y="180" fill="#a3c0f5" font-size="13" font-weight="700">Lock ladder</text>
  <text x="442" y="201" fill="#c4acec" font-size="11.5">track it between</text>
  <text x="442" y="218" fill="#c4acec" font-size="11.5">detections, and hold it</text>
  <text x="442" y="234" fill="#c4acec" font-size="11.5">when the detector blinks</text>

  <rect x="618" y="156" width="176" height="88" rx="9" fill="#0b0e15" stroke="#11429c"/>
  <text x="632" y="180" fill="#a3c0f5" font-size="13" font-weight="700">Where am I</text>
  <text x="632" y="201" fill="#5f91ed" font-size="11.5">optical-flow velocity,</text>
  <text x="632" y="218" fill="#5f91ed" font-size="11.5">floor height and course</text>
  <text x="632" y="234" fill="#5f91ed" font-size="11.5">priors → one estimator</text>

  <rect x="820" y="156" width="278" height="88" rx="9" fill="#0b0e15" stroke="#11429c"/>
  <text x="834" y="180" fill="#a3c0f5" font-size="13" font-weight="700">Mission and control decision</text>
  <text x="834" y="201" fill="#5f91ed" font-size="11.5">"centre the gate, then drive through it"</text>
  <text x="834" y="218" fill="#5f91ed" font-size="11.5">becomes an axis demand, or a single</text>
  <text x="834" y="234" fill="#5f91ed" font-size="11.5">primitive the board runs by itself</text>

  <line x1="212" y1="200" x2="234" y2="200" stroke="#81a8f1" stroke-width="2" marker-end="url(#v)"/>
  <line x1="402" y1="200" x2="424" y2="200" stroke="#81a8f1" stroke-width="2" marker-end="url(#v)"/>
  <line x1="592" y1="200" x2="614" y2="200" stroke="#81a8f1" stroke-width="2" marker-end="url(#v)"/>
  <line x1="794" y1="200" x2="816" y2="200" stroke="#81a8f1" stroke-width="2" marker-end="url(#v)"/>

  <rect x="62" y="268" width="1036" height="80" rx="9" fill="#0a0d12" stroke="#11429c"/>
  <text x="80" y="292" fill="#a3c0f5" font-size="12.5" font-weight="700">Everything above is one ROS 2 graph, and every part of it is a switch</text>
  <text x="80" y="314" fill="#5f91ed" font-size="12">Detection, the visual lock, optical flow, the localization filter, refraction correction, mission budgeting — each is opt-in, with a</text>
  <text x="80" y="333" fill="#5f91ed" font-size="12">default we can defend. Bring the vehicle up with control alone, then add one capability at a time and watch what it costs.</text>

  <line x1="580" y1="368" x2="580" y2="424" stroke="#30ddc9" stroke-width="2.6" marker-end="url(#t)"/>
  <rect x="404" y="376" width="352" height="34" rx="8" fill="#090c11" stroke="#189587"/>
  <text x="580" y="398" fill="#a0efe6" font-size="12.5" text-anchor="middle" font-family="ui-monospace, monospace">one USB-C cable · MAVLink · no router, no network</text>

  <rect x="40" y="432" width="1080" height="180" rx="14" fill="#090b10" stroke="#189587"/>
  <rect x="40" y="432" width="1080" height="34" rx="14" fill="#090c11"/>
  <rect x="40" y="452" width="1080" height="14" fill="#090c11"/>
  <text x="60" y="456" fill="#a0efe6" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">SROT BOARD — 500 Hz, and it keeps running whatever the Pi is doing</text>

  <rect x="62" y="484" width="300" height="108" rx="9" fill="#090c11" stroke="#189587"/>
  <text x="76" y="508" fill="#a3c0f5" font-size="13" font-weight="700">Two ways to ask for motion</text>
  <text x="76" y="530" fill="#9defe5" font-size="11.5">STREAM — four axis demands per frame,</text>
  <text x="76" y="547" fill="#9defe5" font-size="11.5">for a vision loop that keeps correcting</text>
  <text x="76" y="570" fill="#9defe5" font-size="11.5">PRIMITIVE — "forward 3 s at 40 %",</text>
  <text x="76" y="586" fill="#9defe5" font-size="11.5">run and braked entirely on the board</text>

  <rect x="384" y="484" width="300" height="108" rx="9" fill="#090c11" stroke="#189587"/>
  <text x="398" y="508" fill="#a3c0f5" font-size="13" font-weight="700">The loop we cannot outrun</text>
  <text x="398" y="530" fill="#9defe5" font-size="11.5">The Pi sends intent tens of times a</text>
  <text x="398" y="547" fill="#9defe5" font-size="11.5">second. The board corrects attitude</text>
  <text x="398" y="564" fill="#9defe5" font-size="11.5">500 times a second underneath it —</text>
  <text x="398" y="583" fill="#9defe5" font-size="11.5">about 25 corrections per command.</text>

  <rect x="706" y="484" width="392" height="108" rx="9" fill="#0b0e14" stroke="#1245a4"/>
  <text x="720" y="508" fill="#a3c0f5" font-size="13" font-weight="700">And it answers back</text>
  <text x="720" y="530" fill="#739eef" font-size="11.5">attitude · depth · water temperature · leak · kill switch</text>
  <text x="720" y="549" fill="#739eef" font-size="11.5">both battery packs · per-ESC RPM · depth-loop internals</text>
  <text x="720" y="568" fill="#739eef" font-size="11.5">stamped on the board's own clock, so a late message is still</text>
  <text x="720" y="585" fill="#739eef" font-size="11.5">usable — we know when it was true, not when it arrived</text>

  <line x1="362" y1="538" x2="382" y2="538" stroke="#30ddc9" stroke-width="2" marker-end="url(#t)"/>
  <line x1="684" y1="538" x2="704" y2="538" stroke="#30ddc9" stroke-width="2" marker-end="url(#t)"/>

  <rect x="40" y="636" width="536" height="120" rx="14" fill="#090c11" stroke="#11429c"/>
  <text x="62" y="664" fill="#a3c0f5" font-size="13.5" font-weight="700">The operator, over the air</text>
  <text x="62" y="688" fill="#5f91ed" font-size="12">Bondor — our ground station — reaches the board through a LoRa</text>
  <text x="62" y="707" fill="#5f91ed" font-size="12">bridge: live telemetry, parameters, tuning, motor tests, and the</text>
  <text x="62" y="726" fill="#5f91ed" font-size="12">competition's flare order sent to a vehicle already in the water.</text>
  <text x="62" y="746" fill="#3474e9" font-size="11.5" font-family="ui-monospace, monospace">no tether needed for the link that matters</text>

  <rect x="600" y="636" width="520" height="120" rx="14" fill="#090c11" stroke="#11429c"/>
  <text x="622" y="664" fill="#a3c0f5" font-size="13.5" font-weight="700">What this split buys</text>
  <text x="622" y="688" fill="#5f91ed" font-size="12">A dropped frame is a late correction, not a falling vehicle. A crashed</text>
  <text x="622" y="707" fill="#5f91ed" font-size="12">mission node leaves a hull that still holds attitude and still surfaces</text>
  <text x="622" y="726" fill="#5f91ed" font-size="12">by itself. Vision can be slow and thoughtful, because it is no longer</text>
  <text x="622" y="745" fill="#5f91ed" font-size="12">the thing keeping the vehicle upright.</text>
</svg>
