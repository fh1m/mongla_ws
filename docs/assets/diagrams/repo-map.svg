<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" width="1160" height="700" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#080a0e"/><stop offset="1" stop-color="#07090d"/>
    </linearGradient>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fa9d2c"/>
    </marker>
    <marker id="wire" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#30ddc9"/>
    </marker>
  </defs>
  <rect width="1160" height="700" fill="url(#bg4)"/>

  <text x="40" y="50" fill="#a3c0f5" font-size="25" font-weight="700">Four repositories, one vehicle</text>
  <text x="40" y="76" fill="#6293ee" font-size="14">Nobody commits to anyone else's repo. Everything crosses as a pull request — which is exactly why a missing feature is something we can ask for.</text>

  <rect x="60" y="112" width="440" height="180" rx="14" fill="#090c11" stroke="#1245a4"/>
  <text x="84" y="144" fill="#a3c0f5" font-size="17" font-weight="700">mongla_ws — "Mongla"</text>
  <text x="84" y="168" fill="#8aaef2" font-size="12.5" font-family="ui-monospace, monospace">this repository · ROS 2 · Python</text>
  <text x="84" y="196" fill="#5f91ed" font-size="12.5">The autonomy brain: perception on the Hailo, localization,</text>
  <text x="84" y="215" fill="#5f91ed" font-size="12.5">the mission language, and the one node that talks to the board.</text>
  <text x="84" y="242" fill="#5f91ed" font-size="12.5">Decides what the vehicle should do next, and proves it with</text>
  <text x="84" y="261" fill="#5f91ed" font-size="12.5">tests and measurements rather than confidence.</text>
  <text x="84" y="282" fill="#3474e9" font-size="11.5" font-family="ui-monospace, monospace">autonomy team</text>

  <rect x="660" y="112" width="440" height="180" rx="14" fill="#090b10" stroke="#189587"/>
  <text x="684" y="144" fill="#a3c0f5" font-size="17" font-weight="700">srot-control-board — "Hengla"</text>
  <text x="684" y="168" fill="#7ceadd" font-size="12.5" font-family="ui-monospace, monospace">firmware · ESP32 + RP2350 Pico · C++</text>
  <text x="684" y="196" fill="#9defe5" font-size="12.5">The reflexes: a 500 Hz control loop, eleven flight modes,</text>
  <text x="684" y="215" fill="#9defe5" font-size="12.5">on-board move primitives, self-tuning, and failsafes that</text>
  <text x="684" y="234" fill="#9defe5" font-size="12.5">surface the vehicle without asking anyone's permission.</text>
  <text x="684" y="261" fill="#9defe5" font-size="12.5">Every sensor on the vehicle is wired to this board.</text>
  <text x="684" y="282" fill="#4ce2d0" font-size="11.5" font-family="ui-monospace, monospace">firmware team — lead: Rakibul Islam</text>

  <rect x="60" y="340" width="440" height="168" rx="14" fill="#090c11" stroke="#11429c"/>
  <text x="84" y="372" fill="#a3c0f5" font-size="17" font-weight="700">srot-ground-station — "Bondor"</text>
  <text x="84" y="396" fill="#8aaef2" font-size="12.5" font-family="ui-monospace, monospace">desktop app + LoRa bridge · TypeScript</text>
  <text x="84" y="424" fill="#5f91ed" font-size="12.5">The human's window into the vehicle: live telemetry, every</text>
  <text x="84" y="443" fill="#5f91ed" font-size="12.5">parameter, tuning, motor tests, black-box analysis, and the</text>
  <text x="84" y="462" fill="#5f91ed" font-size="12.5">radio link that reaches a hull already in the water.</text>
  <text x="84" y="492" fill="#3474e9" font-size="11.5" font-family="ui-monospace, monospace">ground-station team</text>

  <rect x="660" y="340" width="440" height="168" rx="14" fill="#090c11" stroke="#11429c"/>
  <text x="684" y="372" fill="#a3c0f5" font-size="17" font-weight="700">srot-esc-flasher</text>
  <text x="684" y="396" fill="#8aaef2" font-size="12.5" font-family="ui-monospace, monospace">bench tool · spare ESP32 · C++</text>
  <text x="684" y="424" fill="#5f91ed" font-size="12.5">Turns a spare board into a programmer for the motor</text>
  <text x="684" y="443" fill="#5f91ed" font-size="12.5">controllers, so they run firmware that can report RPM.</text>
  <text x="684" y="462" fill="#fa9d2c" font-size="12.5">Without this step, "how fast is that thruster actually</text>
  <text x="684" y="481" fill="#fa9d2c" font-size="12.5">turning?" has no answer at all.</text>

  <line x1="500" y1="196" x2="656" y2="196" stroke="#30ddc9" stroke-width="2.4" marker-end="url(#wire)"/>
  <line x1="656" y1="222" x2="500" y2="222" stroke="#30ddc9" stroke-width="2.4" marker-end="url(#wire)"/>
  <text x="578" y="188" fill="#a0efe6" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">commands</text>
  <text x="578" y="244" fill="#a0efe6" font-size="11.5" text-anchor="middle" font-family="ui-monospace, monospace">telemetry</text>

  <line x1="280" y1="336" x2="280" y2="296" stroke="#30ddc9" stroke-width="2" marker-end="url(#wire)"/>
  <line x1="880" y1="336" x2="880" y2="296" stroke="#30ddc9" stroke-width="2" marker-end="url(#wire)"/>
  <text x="292" y="322" fill="#4ce2d0" font-size="11" font-family="ui-monospace, monospace">LoRa radio</text>
  <text x="892" y="322" fill="#4ce2d0" font-size="11" font-family="ui-monospace, monospace">flashes the ESCs</text>

  <rect x="60" y="540" width="1040" height="128" rx="14" fill="#080a0e" stroke="#a95f04"/>
  <text x="84" y="570" fill="#fa9d2c" font-size="15" font-weight="700">The rule that makes this work: if the vehicle cannot do something, that is a pull request, not a workaround</text>
  <text x="84" y="598" fill="#fcc582" font-size="12.5">Need the motors to report presence? Ask firmware. Need the board to accept a velocity measurement? Ask firmware. Need another</text>
  <text x="84" y="617" fill="#fcc582" font-size="12.5">sensor on the hull? Ask hardware. Each ask arrives with the evidence that produced it — a line of their source, or a number measured</text>
  <text x="84" y="636" fill="#fcc582" font-size="12.5">on the board. A handful of constants are shared between repos and frozen: neither side may move them alone, in either direction.</text>
  <text x="84" y="658" fill="#f88b06" font-size="11.5" font-family="ui-monospace, monospace">nine written asks live in .claude/context/upstream/ — each reproducible before it was sent</text>

  <path d="M300 536 L300 512" fill="none" stroke="#fa9d2c" stroke-width="2" marker-end="url(#pr)"/>
  <path d="M860 536 L860 512" fill="none" stroke="#fa9d2c" stroke-width="2" marker-end="url(#pr)"/>
  <path d="M520 300 L520 536" fill="none" stroke="#fa9d2c" stroke-width="1.6" stroke-dasharray="6 5"/>
  <path d="M640 300 L640 536" fill="none" stroke="#fa9d2c" stroke-width="1.6" stroke-dasharray="6 5"/>
</svg>
