<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-label="Four layers of the stack placed on a logarithmic rate axis"><style>text{font-family:Zed Mono,ui-monospace,monospace}.l{font-size:9.5px;fill:#788294;letter-spacing:.14em}.v{font-size:11px;fill:#e4e8ef}.r{font-size:10px;fill:#ff5747;letter-spacing:.06em}.b{font-size:10px;fill:#5a8dff;letter-spacing:.06em}.h{font-size:17px;fill:#fff;font-weight:700;letter-spacing:-.02em}.big{font-size:30px;fill:#fff;font-weight:700;letter-spacing:-.04em}</style>
<text x="0.0" y="22.0" class="h" text-anchor="start">Each layer trusts the one below it to be faster than its problem</text>
<text x="0.0" y="42.0" class="l" text-anchor="start">VERTICAL POSITION IS RATE · LOGARITHMIC · 1 Hz AT THE TOP, 1 kHz AT THE FLOOR</text>
<line x1="260" y1="100.0" x2="958" y2="100.0" stroke="#1a2030" stroke-width="1" stroke-dasharray="2 7"/>
<text x="252.0" y="104.0" class="l" text-anchor="end">1 Hz</text>
<line x1="260" y1="220.7" x2="958" y2="220.7" stroke="#1a2030" stroke-width="1" stroke-dasharray="2 7"/>
<text x="252.0" y="224.7" class="l" text-anchor="end">10 Hz</text>
<line x1="260" y1="341.3" x2="958" y2="341.3" stroke="#1a2030" stroke-width="1" stroke-dasharray="2 7"/>
<text x="252.0" y="345.3" class="l" text-anchor="end">100 Hz</text>
<line x1="260" y1="462.0" x2="958" y2="462.0" stroke="#1a2030" stroke-width="1" stroke-dasharray="2 7"/>
<text x="252.0" y="466.0" class="l" text-anchor="end">1000 Hz</text>
<rect x="268" y="116.3" width="682" height="40" fill="#788294" fill-opacity=".10" stroke="#788294" stroke-width="1"/>
<line x1="268" y1="116.3" x2="268" y2="156.3" stroke="#788294" stroke-width="3"/>
<text x="284.0" y="134.3" class="v" text-anchor="start">MISSION</text>
<text x="284.0" y="150.3" class="l" text-anchor="start">what to do, and when to give up</text>
<text x="934.0" y="134.3" class="b" text-anchor="end">2 Hz</text>
<text x="284.0" y="171.3" class="l" text-anchor="start">mission budgeting · the detected() window · scorecards</text>
<text x="972.0" y="140.3" class="l" text-anchor="start">BUILT</text>
<rect x="268" y="237.0" width="682" height="40" fill="#004eff" fill-opacity=".10" stroke="#004eff" stroke-width="1"/>
<line x1="268" y1="237.0" x2="268" y2="277.0" stroke="#004eff" stroke-width="3"/>
<text x="284.0" y="255.0" class="v" text-anchor="start">ESTIMATION</text>
<text x="284.0" y="271.0" class="l" text-anchor="start">where am I, and am I moving</text>
<text x="934.0" y="255.0" class="b" text-anchor="end">20 Hz</text>
<text x="284.0" y="228.0" class="l" text-anchor="start">invariant EKF · optical-flow velocity · replayed late fixes</text>
<text x="972.0" y="261.0" class="l" text-anchor="start">SOFTWARE</text>
<rect x="268" y="288.9" width="682" height="40" fill="#004eff" fill-opacity=".10" stroke="#004eff" stroke-width="1"/>
<line x1="268" y1="288.9" x2="268" y2="328.9" stroke="#004eff" stroke-width="3"/>
<text x="284.0" y="306.9" class="v" text-anchor="start">PERCEPTION</text>
<text x="284.0" y="322.9" class="l" text-anchor="start">what is out there</text>
<text x="934.0" y="306.9" class="b" text-anchor="end">53.9 Hz</text>
<text x="284.0" y="343.9" class="l" text-anchor="start">Hailo-8 detection · the lock ladder · refraction, per camera</text>
<text x="972.0" y="312.9" class="l" text-anchor="start">BENCH</text>
<rect x="268" y="405.7" width="682" height="40" fill="#ff0000" fill-opacity=".10" stroke="#ff0000" stroke-width="1"/>
<line x1="268" y1="405.7" x2="268" y2="445.7" stroke="#ff0000" stroke-width="3"/>
<text x="284.0" y="423.7" class="v" text-anchor="start">REFLEX</text>
<text x="284.0" y="439.7" class="l" text-anchor="start">stay upright, whatever else happens</text>
<text x="934.0" y="423.7" class="r" text-anchor="end">500 Hz</text>
<text x="284.0" y="460.7" class="l" text-anchor="start">attitude · depth · eight-thruster mixing · every failsafe</text>
<text x="972.0" y="429.7" class="l" text-anchor="start">BENCH</text>
<line x1="156" y1="308.9" x2="156" y2="425.7" stroke="#ff5747" stroke-width="1"/>
<path d="M152,313.9 l4,-5 l4,5 M152,420.7 l4,5 l4,-5" fill="none" stroke="#ff5747" stroke-width="1"/>
<text x="146" y="367.3" class="r" text-anchor="middle" transform="rotate(-90 146 367.3)">~9× — the reflex gap</text>
<line x1="0" y1="516" x2="1160" y2="516" stroke="#1a2030"/>
<text x="0.0" y="550.0" class="v" text-anchor="start">A layer may only be slower than the problem it is solving if the layer beneath it is faster.</text>
<text x="0.0" y="570.0" class="l" text-anchor="start">That is the entire architecture. Mission can afford to stop and think because reflex never does.</text>
<text x="0.0" y="598.0" class="r" text-anchor="start">NOTHING ON THIS PLATFORM HAS BEEN IN WATER · STATES READ: BENCH = ON HARDWARE, SOFTWARE = IN TESTS ONLY</text>
</svg>