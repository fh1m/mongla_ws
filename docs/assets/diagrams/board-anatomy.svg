<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 740" width="1160" height="740" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1322"/><stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#37d6a8"/>
    </marker>
    <marker id="a2v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f2b134"/>
    </marker>
  </defs>
  <rect width="1160" height="740" fill="url(#bg2)"/>

  <text x="40" y="50" fill="#e6edf7" font-size="25" font-weight="700">Inside the SROT board: one loop, 500 times a second</text>
  <text x="40" y="76" fill="#93a4bd" font-size="14">Read the hull's state, decide what each axis should do, split that across eight thrusters, listen to what came back. Repeat 2 ms later.</text>

  <rect x="40" y="100" width="1080" height="250" rx="14" fill="#0f1c2a" stroke="#2f6b52"/>
  <rect x="40" y="100" width="1080" height="34" rx="14" fill="#12291f"/>
  <rect x="40" y="120" width="1080" height="14" fill="#12291f"/>
  <text x="60" y="124" fill="#9ff0d3" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">ESP32 CORE 1 — the flight loop. Nothing else is allowed to run here.</text>

  <rect x="62" y="152" width="188" height="176" rx="9" fill="#13263a" stroke="#3c5f7a"/>
  <text x="76" y="176" fill="#e6edf7" font-size="13.5" font-weight="700">1 · SENSE</text>
  <text x="76" y="196" fill="#9fc3dd" font-size="12" font-family="ui-monospace, monospace">SensorRead · 500 Hz</text>
  <text x="76" y="220" fill="#93b6cf" font-size="12">BNO085 IMU — attitude</text>
  <text x="76" y="237" fill="#93b6cf" font-size="12">and rotation rates</text>
  <text x="76" y="258" fill="#93b6cf" font-size="12">Bar30 — depth, water temp</text>
  <text x="76" y="278" fill="#93b6cf" font-size="12">leak · kill · PM1 · PM2</text>
  <text x="76" y="302" fill="#6f8fae" font-size="11" font-family="ui-monospace, monospace">the IMU is ON the board,</text>
  <text x="76" y="317" fill="#6f8fae" font-size="11" font-family="ui-monospace, monospace">not across a cable</text>

  <rect x="284" y="152" width="250" height="176" rx="9" fill="#12291f" stroke="#2f6b52"/>
  <text x="298" y="176" fill="#e6edf7" font-size="13.5" font-weight="700">2 · DECIDE</text>
  <text x="298" y="196" fill="#8fd7b8" font-size="12" font-family="ui-monospace, monospace">ControlLoop · 500 Hz</text>
  <text x="298" y="220" fill="#a9e3c9" font-size="12">The flight mode picks the cascade:</text>
  <text x="298" y="240" fill="#a9e3c9" font-size="12">angle → rate → torque for roll,</text>
  <text x="298" y="257" fill="#a9e3c9" font-size="12">pitch and yaw; a depth PID for heave.</text>
  <text x="298" y="281" fill="#a9e3c9" font-size="12">Output: six demands, each −1 … +1</text>
  <text x="298" y="305" fill="#5fae8d" font-size="11" font-family="ui-monospace, monospace">roll pitch yaw heave surge sway</text>

  <rect x="568" y="152" width="250" height="176" rx="9" fill="#12291f" stroke="#2f6b52"/>
  <text x="582" y="176" fill="#e6edf7" font-size="13.5" font-weight="700">3 · SPLIT</text>
  <text x="582" y="196" fill="#8fd7b8" font-size="12" font-family="ui-monospace, monospace">mixer — Vectored-8</text>
  <text x="582" y="220" fill="#a9e3c9" font-size="12">Six wishes, eight motors. Each motor</text>
  <text x="582" y="237" fill="#a9e3c9" font-size="12">gets a share of every demand.</text>
  <text x="582" y="260" fill="#a9e3c9" font-size="12">If any share exceeds full thrust the</text>
  <text x="582" y="277" fill="#a9e3c9" font-size="12">whole set scales down together, so</text>
  <text x="582" y="294" fill="#a9e3c9" font-size="12">the shape of the move survives.</text>
  <text x="582" y="317" fill="#5fae8d" font-size="11" font-family="ui-monospace, monospace">M1–M4 horizontal @45° · M5–M8 vertical</text>

  <rect x="852" y="152" width="246" height="176" rx="9" fill="#13263a" stroke="#3c5f7a"/>
  <text x="866" y="176" fill="#e6edf7" font-size="13.5" font-weight="700">4 · DRIVE &amp; LISTEN</text>
  <text x="866" y="196" fill="#9fc3dd" font-size="12" font-family="ui-monospace, monospace">DShot out · 500 Hz</text>
  <text x="866" y="220" fill="#93b6cf" font-size="12">An RP2350 Pico speaks bidirectional</text>
  <text x="866" y="237" fill="#93b6cf" font-size="12">DShot to eight Bluejay ESCs.</text>
  <text x="866" y="260" fill="#93b6cf" font-size="12">Commands go out; measured RPM</text>
  <text x="866" y="277" fill="#93b6cf" font-size="12">comes back on the same wire.</text>
  <text x="866" y="301" fill="#f2b134" font-size="11.5">A thruster can now be asked</text>
  <text x="866" y="317" fill="#f2b134" font-size="11.5">whether it actually turned.</text>

  <line x1="250" y1="240" x2="280" y2="240" stroke="#37d6a8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="534" y1="240" x2="564" y2="240" stroke="#37d6a8" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="818" y1="240" x2="848" y2="240" stroke="#37d6a8" stroke-width="2" marker-end="url(#a2)"/>

  <path d="M975 328 L975 362 L156 362 L156 332" fill="none" stroke="#f2b134" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a2v)"/>
  <text x="470" y="356" fill="#f2b134" font-size="11.5" font-family="ui-monospace, monospace">RPM and current, per ESC — the loop can close on measurement, not hope</text>

  <rect x="40" y="384" width="660" height="196" rx="14" fill="#101a2b" stroke="#2a3a55"/>
  <rect x="40" y="384" width="660" height="34" rx="14" fill="#16223a"/>
  <rect x="40" y="404" width="660" height="14" fill="#16223a"/>
  <text x="60" y="408" fill="#cbd7e8" font-size="13.5" font-weight="700" font-family="ui-monospace, monospace">ESP32 CORE 0 — everything that can afford to wait</text>

  <rect x="62" y="436" width="146" height="60" rx="8" fill="#17243b" stroke="#35476a"/>
  <text x="76" y="459" fill="#e6edf7" font-size="12.5" font-weight="600">MAVLink · 100 Hz</text>
  <text x="76" y="478" fill="#8fa2bd" font-size="11.5">talks to the Pi</text>

  <rect x="222" y="436" width="146" height="60" rx="8" fill="#17243b" stroke="#35476a"/>
  <text x="236" y="459" fill="#e6edf7" font-size="12.5" font-weight="600">LoRa + SD · 20 Hz</text>
  <text x="236" y="478" fill="#8fa2bd" font-size="11.5">telemetry, black box</text>

  <rect x="382" y="436" width="146" height="60" rx="8" fill="#17243b" stroke="#35476a"/>
  <text x="396" y="459" fill="#e6edf7" font-size="12.5" font-weight="600">Display · 30 Hz</text>
  <text x="396" y="478" fill="#8fa2bd" font-size="11.5">OLED, RGB, status</text>

  <rect x="542" y="436" width="136" height="60" rx="8" fill="#17243b" stroke="#35476a"/>
  <text x="556" y="459" fill="#e6edf7" font-size="12.5" font-weight="600">Buzzer · 200 Hz</text>
  <text x="556" y="478" fill="#8fa2bd" font-size="11.5">audible state</text>

  <text x="62" y="530" fill="#93a4bd" font-size="12.5">This split is the whole safety argument: a slow radio, a full SD card or a busy display lives on core 0 and</text>
  <text x="62" y="550" fill="#93a4bd" font-size="12.5">physically cannot delay the loop that keeps the vehicle level on core 1.</text>

  <rect x="724" y="384" width="396" height="196" rx="14" fill="#101a2b" stroke="#2a3a55"/>
  <text x="746" y="412" fill="#cbd7e8" font-size="13.5" font-weight="700">Why eight thrusters</text>
  <g transform="translate(750,426)">
    <rect x="42" y="30" width="96" height="76" rx="6" fill="#16223a" stroke="#3c5f7a"/>
    <text x="90" y="72" fill="#6f8fae" font-size="10.5" text-anchor="middle" font-family="ui-monospace, monospace">hull</text>
    <g stroke="#37d6a8" stroke-width="2.4">
      <line x1="20" y1="18" x2="48" y2="38"/><line x1="160" y1="18" x2="132" y2="38"/>
      <line x1="20" y1="118" x2="48" y2="98"/><line x1="160" y1="118" x2="132" y2="98"/>
    </g>
    <circle cx="68" cy="52" r="7" fill="#13263a" stroke="#8b7cf6" stroke-width="2"/>
    <circle cx="112" cy="52" r="7" fill="#13263a" stroke="#8b7cf6" stroke-width="2"/>
    <circle cx="68" cy="86" r="7" fill="#13263a" stroke="#8b7cf6" stroke-width="2"/>
    <circle cx="112" cy="86" r="7" fill="#13263a" stroke="#8b7cf6" stroke-width="2"/>
    <text x="186" y="44" fill="#37d6a8" font-size="11.5">4 × horizontal at 45°</text>
    <text x="186" y="62" fill="#8fa2bd" font-size="11">drive, strafe and turn</text>
    <text x="186" y="90" fill="#8b7cf6" font-size="11.5">4 × vertical</text>
    <text x="186" y="108" fill="#8fa2bd" font-size="11">rise, sink, roll and pitch</text>
  </g>
  <text x="746" y="566" fill="#93a4bd" font-size="12">Any direction, any attitude, independently — that is what "vectored" means.</text>

  <rect x="40" y="606" width="1080" height="104" rx="14" fill="#1b1520" stroke="#6b3a4a"/>
  <text x="62" y="634" fill="#f2b134" font-size="13.5" font-weight="700">When something goes wrong, the board does not wait to be told</text>
  <text x="62" y="660" fill="#c9b6a0" font-size="12.5">Water inside · thruster battery sagging · the operator's link gone · the companion computer silent · surfaced and idle.</text>
  <text x="62" y="682" fill="#c9b6a0" font-size="12.5">Each one drives the vehicle to the surface on its own, whether or not the Pi is still alive. Translation and yaw are zeroed on the</text>
  <text x="62" y="700" fill="#c9b6a0" font-size="12.5">way up: a vehicle that has lost its operator should not still be driving somewhere.</text>
</svg>
