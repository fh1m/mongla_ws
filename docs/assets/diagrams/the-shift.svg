<text x="0" y="17" fill="#e2e6ec" font-size="15" font-weight="600" font-family="Space Grotesk,sans-serif" letter-spacing="-.01em">How long a mistake is allowed to stand.</text>
<text x="0" y="36" fill="#666f7e" font-size="9" text-anchor="start" letter-spacing=".1em" font-weight="400" font-family="JetBrains Mono,monospace">THE SAME DISTURBANCE ON BOTH ARCHITECTURES. EACH TICK IS A MOMENT A CORRECTION CAN HAPPEN.</text>
<text x="0" y="70" fill="#e2e6ec" font-size="10.5" text-anchor="start" letter-spacing=".16em" font-weight="500" font-family="JetBrains Mono,monospace">BEFORE — ROBOSUB 2023 &amp; 2025</text>
<text x="0" y="86" fill="#666f7e" font-size="9.5" text-anchor="start" letter-spacing=".04em" font-weight="400" font-family="JetBrains Mono,monospace">Pixhawk + ArduSub. Our outer loop corrected it, at 20 Hz.</text>
