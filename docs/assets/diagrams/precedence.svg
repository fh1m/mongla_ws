<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 470" width="1160" height="470" role="img" aria-label="Which value a launch argument takes: the highest layer that sets it"><style>text{font-family:Zed Mono,ui-monospace,monospace}.l{font-size:9.5px;fill:#788294;letter-spacing:.14em}.v{font-size:11px;fill:#e4e8ef}.r{font-size:10px;fill:#ff2a14;letter-spacing:.06em}.b{font-size:10px;fill:#5a8dff;letter-spacing:.06em}.h{font-size:17px;fill:#fff;font-weight:700;letter-spacing:-.02em}.big{font-size:30px;fill:#fff;font-weight:700;letter-spacing:-.04em}</style>
<rect width="1160" height="470" fill="#05070a"/>
<text x="32.0" y="46.0" class="h" text-anchor="start">Which value wins</text>
<text x="32.0" y="68.0" class="l" text-anchor="start">FOR EACH ARGUMENT, THE HIGHEST LAYER THAT SAYS ANYTHING · DEFAULTS READ FROM bringup.launch.py</text>
<text x="400.0" y="116.0" class="v" text-anchor="middle">vision</text>
<text x="600.0" y="116.0" class="v" text-anchor="middle">pool_depth_m</text>
<text x="800.0" y="116.0" class="v" text-anchor="middle">medium</text>
<text x="1000.0" y="116.0" class="v" text-anchor="middle">conf</text>
<line x1="32" y1="130" x2="1100" y2="130" stroke="#1a2030" stroke-width="1"/>
<text x="32.0" y="158.0" class="v" text-anchor="start">TYPED</text>
<text x="32.0" y="174.0" class="l" text-anchor="start">name:=value on the command line</text>
<text x="400.0" y="166.0" class="l" text-anchor="middle">--</text>
<rect x="530.0" y="144" width="140" height="34" fill="none" stroke="#ff2a14" stroke-width="1.6"/>
<text x="600.0" y="166.0" class="r" text-anchor="middle">1.4</text>
<rect x="730.0" y="144" width="140" height="34" fill="none" stroke="#ff2a14" stroke-width="1.6"/>
<text x="800.0" y="166.0" class="r" text-anchor="middle">air</text>
<text x="1000.0" y="166.0" class="l" text-anchor="middle">--</text>
<line x1="32" y1="192" x2="1100" y2="192" stroke="#1a2030" stroke-width="1"/>
<text x="32.0" y="220.0" class="v" text-anchor="start">THE FILE</text>
<text x="32.0" y="236.0" class="l" text-anchor="start">~/.mongla/bringup.yaml</text>
<rect x="330.0" y="206" width="140" height="34" fill="none" stroke="#ff2a14" stroke-width="1.6"/>
<text x="400.0" y="228.0" class="r" text-anchor="middle">true</text>
<text x="600.0" y="228.0" class="l" text-anchor="middle">1.6</text>
<text x="800.0" y="228.0" class="l" text-anchor="middle">--</text>
<text x="1000.0" y="228.0" class="l" text-anchor="middle">--</text>
<line x1="32" y1="254" x2="1100" y2="254" stroke="#1a2030" stroke-width="1"/>
<text x="32.0" y="282.0" class="v" text-anchor="start">THE DEFAULT</text>
<text x="32.0" y="298.0" class="l" text-anchor="start">written in bringup.launch.py</text>
<text x="400.0" y="290.0" class="l" text-anchor="middle">false</text>
<text x="600.0" y="290.0" class="l" text-anchor="middle">nan</text>
<text x="800.0" y="290.0" class="l" text-anchor="middle">water</text>
<rect x="930.0" y="268" width="140" height="34" fill="none" stroke="#ff2a14" stroke-width="1.6"/>
<text x="1000.0" y="290.0" class="r" text-anchor="middle">0.45</text>
<line x1="32" y1="332" x2="1100" y2="332" stroke="#e4e8ef" stroke-width="1.2"/>
<text x="32.0" y="362.0" class="v" text-anchor="start">WHAT THE NODES GET</text>
<line x1="400.0" y1="240" x2="400.0" y2="346" stroke="#ff0000" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="400.0" y="362.0" class="v" text-anchor="middle">true</text>
<line x1="600.0" y1="178" x2="600.0" y2="346" stroke="#ff0000" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="600.0" y="362.0" class="v" text-anchor="middle">1.4</text>
<line x1="800.0" y1="178" x2="800.0" y2="346" stroke="#ff0000" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="800.0" y="362.0" class="v" text-anchor="middle">air</text>
<line x1="1000.0" y1="302" x2="1000.0" y2="346" stroke="#ff0000" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="1000.0" y="362.0" class="v" text-anchor="middle">0.45</text>
<text x="32.0" y="400.0" class="l" text-anchor="start">A file key that no launch argument declares refuses the launch and names the closest real one.</text>
<text x="32.0" y="416.0" class="l" text-anchor="start">A misspelt name:=value is ignored by ros2 launch without a word, which is why the file is the safer place.</text>
<text x="32.0" y="432.0" class="l" text-anchor="start">MONGLA_BRINGUP=none ignores the file; MONGLA_BRINGUP=/other/file.yaml reads another one.</text>
</svg>