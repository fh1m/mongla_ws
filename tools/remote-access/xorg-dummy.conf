# xorg-dummy.conf — headless virtual display FALLBACK for the Jetson.
#
# WHEN TO USE THIS:
#   Only when the Jetson boots with NO monitor AND no HDMI dummy plug attached.
#   The NVIDIA GPU needs a valid display signal to bring up a desktop; with
#   nothing plugged in you get a black remote desktop. Our chosen primary fix is
#   a ~$5 HDMI dummy plug (a real signal, most robust). This software dummy is
#   the no-hardware alternative.
#
# WHY IT IS NOT INSTALLED BY DEFAULT:
#   Dropping this into /etc/X11/xorg.conf.d/ FORCES the "dummy" driver, which
#   OVERRIDES the real GPU output — you do not want that when a monitor or dummy
#   plug is present. tools/setup_remote_access.sh installs it ONLY with the
#   explicit `--dummy-display` flag. To use it manually:
#     sudo cp tools/remote-access/xorg-dummy.conf /etc/X11/xorg.conf.d/10-dummy.conf
#     sudo systemctl restart gdm3      # drops the current desktop session
#   Remove it (to go back to the real GPU / dummy plug):
#     sudo rm /etc/X11/xorg.conf.d/10-dummy.conf && sudo systemctl restart gdm3

Section "Device"
    Identifier  "DummyGPU"
    Driver      "dummy"
    VideoRam    256000
EndSection

Section "Monitor"
    Identifier  "DummyMonitor"
    HorizSync   5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    # 1920x1080 @ 60 Hz CVT modeline.
    Modeline "1920x1080" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
EndSection

Section "Screen"
    Identifier  "DummyScreen"
    Device      "DummyGPU"
    Monitor     "DummyMonitor"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Modes   "1920x1080"
    EndSubSection
EndSection
