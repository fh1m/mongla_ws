# Bringup settings -- GENERATED by tools/gen_reference.py, do not edit.
# This copy is NOT LOADED AT RUNTIME: it is the template. The launch
# reads ~/.mongla/bringup.yaml (or $MONGLA_BRINGUP).
#
# Copy to ~/.mongla/bringup.yaml on the vehicle and UNCOMMENT only the
# lines you want to change. Then a plain
#     ros2 launch mongla_manager bringup.launch.py
# uses them. `name:=value` on the command line still wins over this file.
# A key that is not listed here stops the launch (a typo cannot vanish).
# How it works: src/mongla_manager/mongla_manager/launch_defaults.py
#
# Each line shows the repository default.

#   Connection mode: pool|sim|auto|desk|laptop
# mode: pool

#   Yaw source: mavlink_ahrs|dvl|bno085|bno085_dvl
# yaw_source: mavlink_ahrs

#   Autopilot backend: srot|pixhawk (srot = the SROT/Hengla board over USB
#   serial; pixhawk = the ArduSub/BlueOS path)
# flight_controller: srot

#   SROT serial device, '' = autodetect. A path (/dev/serial/by-id/...) or any
#   pymavlink connection string
# mav_device: ''

#   OPTIONAL labels for the log, "<board_channel>:<name>", e.g. "9:torpedo_1,
#   11:dropper_1". Labels ONLY -- fire(N) always addresses board channel N;
#   nothing here routes a shot
# payload_channels: ''

#   Arm against firmware older than FW_BEHAVIOUR_REV_REQUIRED. Accepts an un-
#   braked stop -- leave false
# allow_fw_behaviour_mismatch: false

#   (no description)
# dvl_host: 192.168.2.201

#   (no description)
# dvl_port: 9000

#   BNO085 device, or "auto" to scan USB VID/PID.
# bno085_port: auto

#   Re-zero the barometer at the surface. TRUE on the pool hull. The simulator
#   passes false: SITL ACKs the calibration and then stops tracking depth.
# baro_calibration: true

#   Payload board device, or "auto" to scan USB VID/PID.
# payload_port: auto

#   Auto-connect DVL at startup (true|false)
# dvl_auto_connect: true

#   Start camera + detector alongside manager
# vision: false

#   pi = both cameras + calibration (vision_pi.launch.py, the vehicle);
#   generic = single camera, no calibration (vision.launch.py, dev/CUDA).
# vision_stack: pi

#   vision_stack:=pi -- vision_pi's own profile argument (its `vision:=`).
#   Renamed here because `vision` is this file's boolean on/off switch.
# vision_profile: fast

#   vision_stack:=pi -- forward-camera model stem.
# fwd_model: gate_sharks

#   vision_stack:=pi -- downward-camera model stem.
# dwn_model: bin_fire_blood

#   vision_stack:=pi -- forward class allowlist (empty = the model sidecar's
#   full set).
# fwd_classes: ''

#   vision_stack:=pi -- downward class allowlist.
# dwn_classes: ''

#   Run the invariant filter (mongla_localization). Read-only: it publishes
#   /mongla/odom and commands nothing, so it is on by default. Set false to
#   take it off the graph.
# localization: true

#   vision_stack:=pi -- start flow_node (downward-camera velocity). Pairs with
#   the manager's position_source:=flow.
# flow: false

#   flow:=true -- the venue's shallowest floor, metres (#35).
# pool_depth_min_m: nan

#   flow:=true -- the venue's deepest floor, metres (#35).
# pool_depth_max_m: nan

#   flow:=true -- metres from the DOWNWARD camera to the floor. Required:
#   without it flow_node publishes quality 0 and refuses, by design.
# pool_depth_m: nan

#   manager: RIEKF body velocity -> board (VISION_SPEED_ESTIMATE). Needs fw PR
#   #23 to act.
# velocity_uplink: false

#   manager: RIEKF pose -> board (VISION_POSITION_ESTIMATE).
# position_uplink: false

#   manager: srot vision frames fitted to the mixer yaw-first + saturation-
#   aware anti-windup.
# mixer_aware: true

#   localization: zero-velocity updates when still.
# zupt: true

#   localization: velocity from commanded demand when the floor goes blank.
# demand_aid: true

#   localization: apply flow/depth/fixes at the instant they describe,
#   replaying later events.
# retrodict: false

#   localization: fuse the landmark heading anchor.
# use_yaw: false

#   flow: sun-caustic erosion + bare-floor refusal.
# caustics: true

#   flow: lane-line heading (mod 180) yaw bound.
# lane_lines: false

#   flow: pool tile size in metres; 0 = tile grating (height + yaw bound) OFF.
# tile_m: 0.0

#   The medium the VEHICLE is in. Read by flow_node, lock_node AND pnp_node --
#   one value, one argument. `air` for a bench run, or the scale is off by
#   ~1.33.
# medium: water

#   vision_stack:=pi, lock:=true -- the class the ladder follows. Empty = any
#   class, and no 6-DoF pose.
# lock_class: ''

#   vision_stack:=pi -- start lock_node (follower + XFeat anchor continuity
#   ladder).
# lock: true

#   vision_stack:=pi -- start both detectors paused; the mission resumes the
#   one it needs. false = both infer and compete.
# paused: true

#   Camera ROLE -- names the topics and nodes (forward|downward). Change
#   `camera_profile`, not this, to point a role at other hardware.
# camera: forward

#   Camera HARDWARE profile (CAMERA_PROFILES in mongla_vision/config.py -- the
#   loaded copy). Default pi_forward matches flight_controller:=srot (Pi box).
#   On the Jetson pass forward.
# camera_profile: pi_forward

#   vision_stack:=generic -- model stem in mongla_vision/models/ (a
#   <stem>.yaml sidecar must sit beside it).
# model: gate_sharks

#   vision_stack:=generic -- multi-model registry, CSV name=stem:
#   "gate=gate_sharks,bins=bin_fire_blood"
# models: ''

#   Registry key to start with (requires models:="..." to be set)
# active_model: ''

#   CSV class names for detector
# classes: gate

#   Detector confidence floor. 0.45 is gate_sharks' measured bar; another
#   model's bar is in its <stem>.yaml.
# conf: 0.45

#   Inference square size. NOTE: a TensorRT .engine bakes imgsz at export --
#   this only re-scales the .pt fallback. For TRT, re-export to match
#   (export_engine --all --imgsz <N>), then imgsz:=<N>.
# imgsz: 640

#   Post-NMS detection cap (runtime; lower toward ~10 if NMS is the FPS
#   bottleneck on busy frames).
# max_det: 100

#   Open vision_display (OpenCV viewer) alongside vision pipeline
# viewer: false

#   Start foxglove_bridge (WebSocket telemetry on foxglove_port). Off the
#   mission path -- pure viz. Needs ros-humble-foxglove-bridge installed.
#   Connect the Foxglove desktop app to ws://<jetson-ip>:<foxglove_port>.
# foxglove: false

#   foxglove_bridge WebSocket port
# foxglove_port: 8765
