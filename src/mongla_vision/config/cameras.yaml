# ============================================================================
#  NOTE: THIS FILE IS NOT LOADED AT RUNTIME.  (B49)
#
#  This is the file that already burned us once: switching the Pi cameras to the
#  low-latency source by editing it changed NOTHING -- the launch came up on the
#  old source, published frames, ran detections, and logged no error. The only
#  symptom was a latency number that did not move.
#
#  The loaded copy is `CAMERA_PROFILES` in `mongla_vision/config.py`;
#  `test_camera_profiles.py` is the mechanism that keeps the two in step. Set a
#  value for real with a launch arg or `--ros-args -p <name>:=<value>`.
# ============================================================================
# mongla_vision -- named camera profiles (mirrors CAMERA_PROFILES in
# mongla_vision/config.py). Edit either; keep them in sync.
#
# Pick a profile at launch with -p profile:=<name>. To override fields
# inline, set the source-specific params (device / topic / width / ...).

mongla_vision:
  cameras:
    # Dev machine — Logitech USB RGB webcam on /dev/video4.
    # /dev/video0,2 are IR cameras (Windows Hello); skip those.
    # Override at runtime:  device:=N
    laptop:
      source:   webcam
      device:   4
      width:    1280
      height:   720
      fps:      30
      frame_id: laptop_cam

    logitech:
      source:   webcam
      device:   4
      width:    1280
      height:   720
      fps:      30
      frame_id: laptop_cam

    # ── Raspberry Pi 5 + AI HAT+ ────────────────────────────────────────────
    # MEASURED on the vehicle 2026-09-07, not requested and not assumed.
    #
    # The two PI profiles used to be swapped. The global-shutter Sonix is
    # the BOTTOM camera and the Fantech is the FORWARD one; the udev rules
    # bound the names the other way (and the `forward` rule named a USB port
    # that matched no device at all, so that symlink was hand-made and stale).
    # `pi_forward` therefore opened the bottom camera while every node, launch
    # file and mission looked correct. See kutum/system/udev/99-mongla-cameras.rules.
    #
    #   Sonix   MJPG 640x360 210.17 Hz | 640x400 210.21 | YUYV flat 35.26
    #   Fantech flat 15.00 Hz in EVERY format, resolution and requested rate
    #
    # `fourcc` is a profile field because FORMAT IS PER-CAMERA: it is worth 6x
    # on the Sonix and nothing at all on the Fantech. It could not be
    # expressed before -- the builder hardcoded MJPG.
    #
    # device_path, not device: an index is not port-stable and the two units
    # have already swapped across a reboot.
    pi_forward:
      # The FANTECH -- forward, detection, rolling shutter.
      #
      # It delivers 15.0 fps. Raw `v4l2-ctl --stream-mmap` on Kutum,
      # 2026-11-10: 14.97-15.06 fps at MJPG 640x360, requested 30 or 60,
      # auto exposure or manual 5/30/100 ms. The driver reports 30/1 back,
      # so the reported rate is not evidence, and the exposure controls are
      # inert (mean 124.5-124.8 at every setting). The 2026-09-09 30.18 Hz
      # does not reproduce (measured-bars "Forward camera rate").
      #
      # Asking for 60 stays: it costs nothing when ignored and takes what a
      # better unit offers. For more frames, use pi_forward_global_shutter.
      source:      v4l2
      device_path: /dev/mongla_cam_forward
      width:       640
      height:      360
      fps:         60
      fourcc:      MJPG
      frame_id:    forward_cam

    # The Sonix global-shutter unit moved to the FORWARD port, until the
    # board-triggered sensor arrives. `fwd_profile:=pi_forward_global_shutter`;
    # the Fantech stays the default. udev names a Sonix on the forward port
    # /dev/mongla_cam_forward. Its lens is pi_downward_1280x720.json.
    pi_forward_global_shutter:
      source:      v4l2
      device_path: /dev/mongla_cam_forward
      width:       640
      height:      360
      fps:         210
      fourcc:      MJPG
      frame_id:    forward_cam

    # The SONIX GLOBAL SHUTTER -- bottom, and the optical-flow velocity sensor
    # that stands in for the DVL. Global shutter is the right sensor for that
    # for a reason no frame rate shows: a rolling shutter skews the frame while
    # the hull moves, corrupting the very displacement flow measures.
    #
    # 640x400 also runs at 210 and gives 40 more rows of floor texture for
    # free. Kept at 360 because every calibration and bench number we hold was
    # taken there -- fx is unchanged at the same width, cy is not.
    pi_downward:
      source:      v4l2
      device_path: /dev/mongla_cam_downward
      width:       640
      height:      360
      fps:         210
      fourcc:      MJPG
      frame_id:    downward_cam

    # Generic USB camera roles (no calibration declared). The vehicle uses pi_*.
    # Bench override: -p device:=N at launch (no file edit needed).
    forward:
      source:   webcam
      device:   0
      width:    640
      height:   480
      fps:      30
      frame_id: forward_cam

    # Blue Robotics Low-Light H264 USB (Bus 001 Device 010: ID 32e4:9422).
    # Default /dev/video4 on bench; confirm with: v4l2-ctl --list-devices
    downward:
      source:   webcam
      device:   2
      width:    640
      height:   480
      fps:      30
      frame_id: downward_cam

    # Auto-discover: pick first available USB device. Use discover_on_start:=true
    # on camera_node to log which physical devices map to which indices.
    auto:
      source:   webcam
      device:   0
      width:    640
      height:   480
      fps:      30
      frame_id: auto_cam
