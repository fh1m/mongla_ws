# Where the thrusters actually are.
#
# ⛔ WHY THIS FILE EXISTS. The allocator works in DEMAND space: `allocation.py`
# holds an 8x6 matrix of exactly 0 and +-1 -- a sign pattern with no geometry in
# it. Used as a force sum those +-1 entries overstate surge and sway by
# 1/cos(45 deg) = 41 %, and they cannot express a dead thruster at all. The fix
# is a geometric B, and until now the numbers for one existed NOWHERE in this
# tree: only as prose in README.md and as pixel coordinates in a banner script.
#
# PROVENANCE. Read 2026-09-23 straight off the Onshape model via its REST API
# (`/api/parts/.../boundingboxes`), from an authenticated browser session on
# document 7254e77c / workspace 1ac100c7 / Part Studio 290dbcab. These are CAD
# part bounding boxes in millimetres, not an export and not an inference.
#
# ⚠ A FIRST PASS USED THE RENDER MESH AND WAS WRONG. `docs/assets/cad/hull.mgla`
# is decimated and int16-quantised, and it gave 346.6 mm and 520.4 mm for the
# two pair separations against a documented 350 and 519. Those 3.4 mm were
# recorded as an unreconciled discrepancy. The CAD says 350.0 and 519.0
# EXACTLY: the documentation was right and the mesh measurement was the error.
# Kept here because the retraction is the useful part -- a decimated render
# asset is not a metrology source.
#
# ⚠ THE CAD FRAME IS NOT THE MESH FRAME. In the CAD the long axis is Y; the
# glTF exporter rotated it to Z for the web viewer (glTF is Y-up). Everything
# below is in the CAD's own frame.
#
# ⚠ THE ONSHAPE MCP COULD NOT DO THIS. It exposes FeatureScript authoring:
# `test_featurescript` runs in a scratch document and takes no document id, and
# this document holds no Feature Studios. The browser session could, because the
# page is authenticated and the REST API answers it.

frame:
  # THE CAD's OWN AXES. Y is the long axis; X and Z are the cross-section.
  #   Y  the 702 mm axis. The axial thruster lies on it -> SURGE.
  #   Z  the vertical tunnels' bore                     -> HEAVE.
  #   X  the lateral tunnels' bore                      -> SWAY.
  # ⚠ The +/- SENSE of each axis (which end is the bow, which way is up) is a
  # separate decision and is NOT settled here. Magnitudes and moment arms below
  # are measured; signs are a convention that must be fixed against the vehicle,
  # not guessed from a part list.
  long_axis: y
  sway_axis: x
  heave_axis: z
  source: onshape REST /api/parts/.../boundingboxes
  document: 7254e77ceff30ba82f72f408 / w 1ac100c7c4a0660307476d72 / e 290dbcab1f90336f7e9206f6
  measured: 2026-09-23

# ── the five thrusters, measured ─────────────────────────────────────────────
#
# ⚠ ALL FIVE SIT ON THE CENTRELINE -- every centre is at x = 0, and the only
# off-axis figure anywhere is the axial motor's 8.1 mm in Z. They are
# distributed along Y ONLY. That is what makes the vehicle's actuation legible:
# a force along X at station y makes a moment about Z (YAW); a force along Z at
# station y makes a moment about X (PITCH); and the axial force lies on Y, so
# it makes no moment at all -- pure SURGE.
#
#       lateral pair   -> sway  + yaw
#       vertical pair  -> heave + pitch
#       axial          -> surge
#       nothing        -> ROLL, which is unactuated by design
thrusters:
  # Tunnels identified by the documented 84 mm bore; each one's AXIS is its
  # longest extent (the lateral pair runs 150 mm in X, the vertical pair
  # 130.2 mm in Z). Positions are bounding-box centres, CAD frame, metres.
  - name: lateral_a
    part: Part 1
    position_m: [0.0, -0.1750, 0.0]
    axis: [1, 0, 0]
    bore_mm: 84
    extent_mm: [150, 84, 84]
  - name: lateral_b
    part: Part 11
    position_m: [0.0, 0.1750, 0.0]
    axis: [1, 0, 0]
    bore_mm: 84
    extent_mm: [150, 84, 84]
  - name: vertical_a
    part: Part 2
    position_m: [0.0, -0.2595, 0.0]
    axis: [0, 0, 1]
    bore_mm: 84
    extent_mm: [84, 84, 130.2]
  - name: vertical_b
    part: Part 12
    position_m: [0.0, 0.2595, 0.0]
    axis: [0, 0, 1]
    bore_mm: 84
    extent_mm: [84, 84, 130.2]
  # ⭐ THE AXIAL UNIT, FOUND. An A2212 brushless motor at the nose, on the long
  # axis, with no tunnel near it -- and an 88 mm duct ring at y = -351 just
  # beyond it. It is the vehicle's ONLY source of surge.
  #
  # ⚠ Identified by POSITION, not by bounding-box shape. Its box is
  # [27.8, 40, 43.9] and the largest extent is Z, which would suggest a Z axis;
  # but two identical A2212 motors sit at y = +-267.6 immediately beside the
  # vertical tunnels at y = +-259.5, i.e. those are the tunnel DRIVES, and an
  # A2212's box includes shaft and mount rather than aligning with its axis.
  # Position is the reliable signal here and the shape is not.
  - name: axial
    part: A2212
    position_m: [0.0, -0.3306, 0.0081]
    axis: [0, 1, 0]
    bore_mm: null          # a motor, not a tunnel; duct ring at y=-351 is 88 mm
    extent_mm: [27.8, 40, 43.9]
    identified_by: position

# Pair separations, from the CAD:
#   lateral   0.1750 - (-0.1750) = 0.3500 m   docs say 350 mm   EXACT
#   vertical  0.2595 - (-0.2595) = 0.5190 m   docs say 519 mm   EXACT
# Both agree to the millimetre. Only three A2212 motors are modelled -- the two
# vertical-tunnel drives and the axial -- so the lateral tunnels' motors are not
# in the part list. That does not affect the geometry above.

# ── resolved 2026-09-23: the axial unit is in `thrusters` above ─────────────
axial:
  state: FOUND
  # Found at the nose on the long axis (see `axial` in `thrusters`). One unit,
  # not a pair: the part list holds exactly three A2212 motors, and the other
  # two are the vertical-tunnel drives.
  #
  # ⚠ STILL OPEN: the SIGN convention -- which end of Y is the bow, and whether
  # the axial is a tractor or a pusher. An 88 mm duct ring sits at y = -351,
  # just outboard of the motor, which is where a propeller would exhaust. That
  # is suggestive, not decisive, and a sign error here reverses surge.

# ── what is still missing before a FORCE-domain B is possible ────────────────
#
# This file gives GEOMETRY, not FORCE, and the two must not be confused. A
# geometric B built from the columns above is exact in its directions and its
# moment arms, and silent about newtons.
unknown:
  mass_kg: null                 # ⛔ Onshape reports NO MATERIAL on any part, so
                                #    mass cannot be computed. A scale closes it
                                #    (BENCH B-5). Every force claim waits here.
  centre_of_mass_m: null
  centre_of_buoyancy_m: null    # BG decides the passive roll stability the
                                #    unactuated roll axis depends on
  k_n_per_rpm2: null            # thrust per RPM^2. No default anywhere, on
                                #    purpose (BENCH B-3: a thruster + load cell)
