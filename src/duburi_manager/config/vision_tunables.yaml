# Live-tunable defaults for the two vision verbs (vision_align / vision_move).
#
# Load with:
#   ros2 run duburi_manager start --ros-args \
#       --params-file src/duburi_manager/config/vision_tunables.yaml
#
# Or override individually at any time without restart:
#   ros2 param set /duburi_manager vision.kp_yaw 80.0
#   ros2 param set /duburi_manager vision.lost_grace_s 1.5
#
# Resolution order at goal-dispatch time (in commands.fields_for):
#   1. value the goal supplied (mission/cli kwarg)         -- per-call wins
#   2. live ROS-param value (this file at startup)         -- pool tuning
#   3. hardcoded spec default (duburi_control/commands.py) -- last resort
#
# Param changes take effect on the NEXT vision goal; in-flight goals keep
# their snapshotted values to the end so we never confuse a moving sub by
# yanking a gain mid-tick.

duburi_manager:
  ros__parameters:
    vision:
      # ---- P-gains (percent thrust per unit normalized pixel error) ----
      # Raise if centring is sluggish; lower if the sub oscillates. The
      # P-controller output is then clamped to the per-call `gain` cap, so
      # these set responsiveness while `gain` sets the speed ceiling.
      kp_lat:      60.0   # Ch6 strafe percent  (vision_align lat, vision_move maintain)
      kp_yaw:      60.0   # Ch4 yaw percent     (vision_align yaw)
      kp_depth:    0.05   # metres of depth setpoint nudge per tick (vision_align depth)
      kp_forward: 200.0   # Ch5 forward percent per unit fill error (vision_move)

      # ---- Loss handling ----------------------------------------------
      # Seconds the server coasts (neutral RC) on target loss before
      # reporting LOST so the mission DSL can run its fallback search.
      # Raise for turbid pool water with bursty detector drops.
      lost_grace_s: 1.0

      # ---- vision_move default fill -----------------------------------
      # % of frame the bbox must fill to count as "reached" when a mission
      # leaves fwd_fill unset (0). 95 = drive until the box fills the view.
      frame_fill_default: 95.0

      # ---- vision_align settle ----------------------------------------
      # Consecutive 20 Hz ticks every active axis must stay within err_px
      # before vision_align reports ALIGNED. 3 ticks = 0.15 s.
      align_stable_frames: 3.0
