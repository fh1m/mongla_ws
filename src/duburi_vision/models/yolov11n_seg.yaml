# Class index for the stock Model Zoo yolov8n_seg / yolov11n_seg HEFs.
#
# A .hef carries NO class names, so without this sidecar the id->label map
# does not exist, the allowlist matches nothing and every frame returns [].
# These are the 80 COCO classes in COCO order, read out of the ultralytics
# checkpoint the Model Zoo HEF was compiled from.
#
# This is a STOCK model: it finds people and buses, not gates and bins. It
# is here so the segmentation path can be exercised end to end before a
# model trained on our classes exists.
names:
  0: person
  1: bicycle
  2: car
  3: motorcycle
  4: airplane
  5: bus
  6: train
  7: truck
  8: boat
  9: traffic light
