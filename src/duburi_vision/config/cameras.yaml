# duburi_vision -- named camera profiles (mirrors CAMERA_PROFILES in
# duburi_vision/config.py). Edit either; keep them in sync.
#
# Pick a profile at launch with -p profile:=<name>. To override fields
# inline, set the source-specific params (device / topic / width / ...).
#
# 'jetson_*' / 'blueos' / 'mavlink' currently raise NotImplementedError on
# construction -- they're listed so future profiles drop in by config edit.

duburi_vision:
  cameras:
    # Dev machine — Logitech USB RGB webcam on /dev/video4.
    # /dev/video0,2 are IR cameras (Windows Hello); skip those.
    # Override at runtime:  device:=N
    laptop:
      source:   webcam
      device:   4
      width:    1280
      height:   720
      fps:      30
      frame_id: laptop_cam

    logitech:
      source:   webcam
      device:   4
      width:    1280
      height:   720
      fps:      30
      frame_id: laptop_cam

    # ── Raspberry Pi 5 + AI HAT+ ────────────────────────────────────────────
    # MEASURED on this bench, not assumed. These are the settings that make the
    # Hailo's speed visible: the detector runs at 70-80 Hz, and with the 30 fps
    # `forward` profile the ROS graph published 29.2 Hz -- the CAMERA was the
    # cap, not the accelerator.
    #
    # `fps: 210` IS A PROPERTY OF THE MICRODIA GLOBAL-SHUTTER UNIT ON THIS
    # BENCH, not of the Pi and not of the vehicle's cameras. v4l2-ctl confirms
    # MJPG 640x360 @ 210/120/90 on this device; the second camera here (a
    # Fantech webcam) caps at 15 Hz at every resolution. Do not read 210 as a
    # platform capability.
    #
    # 640x360 costs nothing: the network input is a 640x640 letterbox, so 720p
    # was being downscaled to this anyway, and the horizontal FOV is identical
    # (measured scale 1.01, correlation 0.98). The old 720p setting cost half
    # the frame rate for nothing.
    #
    # device_path, not device: an index is not port-stable and two identical
    # cameras swap on reboot. by-path is tied to the physical USB port.
    pi_forward:
      # `v4l2`, not `webcam`: a keep-up thread and a one-deep mailbox instead
      # of OpenCV's queue. Measured after a 400 ms consumer stall, kernel
      # timestamps: plain read() hands you a 396 ms-old frame, the standard
      # "drain the queue" recipe 348 ms, this 17 ms. The driver keeps the
      # OLDEST frames when its buffers fill, so draining empties a fossil
      # record -- see cameras/v4l2_mailbox.py.
      source:      v4l2
      device_path: /dev/v4l/by-path/platform-xhci-hcd.1-usb-0:2:1.0-video-index0
      width:       640
      height:      360
      fps:         210
      frame_id:    forward_cam

    # Second USB controller, so it does not contend with pi_forward.
    # NOTE: the unit currently in this port is a Fantech webcam that caps at
    # 15 Hz -- the profile asks for 90 and the camera_node WARN will fire and
    # say so, which is the intended behaviour rather than a misconfiguration.
    pi_downward:
      source:      v4l2
      device_path: /dev/v4l/by-path/platform-xhci-hcd.0-usb-0:1:1.0-video-index0
      width:       640
      height:      360
      fps:         90
      frame_id:    downward_cam

    # Vehicle — Blue Robotics Low-Light HD USB on Jetson Orin Nano.
    # Bench override: -p device:=N at launch (no file edit needed).
    forward:
      source:   webcam
      device:   0
      width:    640
      height:   480
      fps:      30
      frame_id: forward_cam

    # Blue Robotics Low-Light H264 USB (Bus 001 Device 010: ID 32e4:9422).
    # Default /dev/video4 on bench; confirm with: v4l2-ctl --list-devices
    downward:
      source:   webcam
      device:   2
      width:    640
      height:   480
      fps:      30
      frame_id: downward_cam

    sim_front:
      source:          ros_topic
      topic:           /duburi/sim/front_camera/image_raw
      expected_width:  640
      expected_height: 480
      expected_fps:    30
      frame_id:        front_cam

    sim_bottom:
      source:          ros_topic
      topic:           /duburi/sim/bottom_camera/image_raw
      expected_width:  640
      expected_height: 480
      expected_fps:    30
      frame_id:        bottom_cam

    # Auto-discover: pick first available USB device. Use discover_on_start:=true
    # on camera_node to log which physical devices map to which indices.
    auto:
      source:   webcam
      device:   0
      width:    640
      height:   480
      fps:      30
      frame_id: auto_cam

    jetson_front:  { source: jetson  }
    jetson_bottom: { source: jetson  }
    blueos:        { source: blueos  }
    mavlink:       { source: mavlink }
