# ============================================================================
#  ⚠  THIS FILE IS NOT LOADED AT RUNTIME.  (B49)
#
#  Nothing reads it; the only reference to its name in the tree is inside an
#  error message. The values that run are the `declare_parameter` defaults in
#  `duburi_vision/detector_node.py`, overridden by launch args.
#
#  Treat everything below as an operator crib sheet -- which models exist, what
#  a sane conf is -- not as configuration. Setting `conf` here does nothing;
#  use `ros2 param set /duburi_detector_<cam> conf 0.45` or the launch arg.
#
#  Disagrees with what ships (node value in brackets):
#      model_path gate_flare_medium_100ep [yolov11n]
#      conf 0.45 [0.35]        classes gate [person]
# ============================================================================
# duburi_vision -- detector defaults
#
# Available custom models (drop .pt in src/duburi_vision/models/ -- NO yaml needed):
#   gate_nano_100ep         ~5 MB   gate only, fastest (Jetson Orin Nano + RTX 2060)
#   gate_medium_100ep      ~42 MB   gate only, higher accuracy
#   gate_medium_200ep      ~42 MB   gate only, 200-epoch fine-tune
#   flare_medium_100ep     ~42 MB   flare only
#   gate_flare_medium_100ep ~42 MB  gate + flare combined  <-- prequal default
#
# Switch model at launch:  ros2 launch ... model:=gate_flare_medium_100ep
# Switch class live:       ros2 param set /duburi_detector classes gate
#                          ros2 param set /duburi_detector classes "gate,flare"
#                          # or from mission DSL: duburi.set_classes('flare')
#
# Pretrained for sim / webcam / bench (COCO 80-class, auto-download):
#   yolov11n (ROBOSUB tested ★ recommended), yolov11s, yolov11m, yolov11l, yolov11x
#   yolo26_nano_pretrained, yolo26_small_pretrained, etc.  (previous family)
#
# device:  cuda:N -> require GPU. cpu -> explicit CPU. auto -> GPU if present.
# half:    FP16 inference -- on (Jetson Orin): ~1.5-2x faster inference, lower
#          latency for vision control, minimal accuracy cost on custom models.
#          Revert live if needed: ros2 param set /duburi_detector_<cam> half false
# conf:    0.45 tuned from underwater preview footage (real gate/flare ~0.90-0.97).
#          Lower to 0.30 only if misses occur in turbid water.
# classes: CSV class names. Changed live with ros2 param set or duburi.set_classes().

duburi_detector:
  ros__parameters:
    model_path:          gate_flare_medium_100ep
    device:              cuda:0
    half:                true
    conf:                0.45
    iou:                 0.50
    imgsz:               640
    classes:             gate
    publish_debug_image: true
    debug_image_hz:      5.0
    alignment_deadband:  0.05
