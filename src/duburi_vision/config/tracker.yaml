tracker_node:
  ros__parameters:

    # ---- ByteTrack association params --------------------------------------- #
    # Frames to hold a lost track alive before dropping it.
    # 150 frames at 30 Hz = 5 s of occlusion tolerance — survives turbulence/brief occlusion.
    track_buffer: 150

    # Consecutive detection frames before a new track is published.
    # 3 = require 3 consecutive frames before publishing (suppresses turbidity false detections).
    min_hits: 3

    # Score threshold above which a new track is immediately activated.
    # 0.40 = higher confidence required than the default 0.25 to spawn a new ID.
    track_activation_threshold: 0.40

    # IoU threshold for the low-confidence second-pass association.
    # 0.2 = more permissive re-association → fewer ID switches on partial occlusion.
    iou_threshold: 0.2

    # ---- Kalman smoother --------------------------------------------------- #
    enable_kalman: true

    # Process noise Q diagonal. 0.05 = very smooth centre tracking; raise for
    # fast-moving targets where lag becomes visible.
    kalman_process_noise: 0.05

    # Measurement noise R diagonal. 2.0 = trust the Kalman prediction more than
    # raw detections → suppresses per-frame centre jitter from detector noise.
    kalman_measurement_noise: 2.0

    # After this many consecutive Kalman-predicted frames (no real detection),
    # the track output is suppressed. 15 frames = 0.75 s at 20 Hz — keeps
    # tracks alive through brief occlusion without flooding with ghost boxes.
    max_predict_frames: 15
