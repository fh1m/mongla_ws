# ============================================================================
#  ⚠  THIS FILE IS NOT LOADED AT RUNTIME.  (B49)
#
#  It is written in `--params-file` shape -- `tracker_node: / ros__parameters:`
#  -- which is exactly what an operator would hand to `ros2 run ... --params-file`
#  and reasonably expect to take effect. No launch file in this repo loads it.
#  Editing a value here changes NOTHING, silently: the node comes up on its own
#  `declare_parameter` default, publishes tracks, and logs no error. The only
#  symptom is a number that does not move -- the same failure `cameras.yaml`
#  already suffered once (see test_camera_profiles.py).
#
#  The values that actually run are the `declare_parameter` defaults in
#  `duburi_vision/tracker_node.py`. To change one for real:
#      ros2 param set /duburi_tracker <name> <value>       (live)
#      ros2 run duburi_vision tracker_node --ros-args -p <name>:=<value>
#      ros2 run ... --params-file <this file>              (then it IS loaded)
#
#  Values below that DISAGREE with what ships (node value in brackets):
#      track_buffer 150 [60]      min_hits 3 [1]
#      kalman_process_noise 0.05 [0.1]
#      kalman_measurement_noise 2.0 [1.0]
#  They are kept as the recorded tuning intent, NOT as a description of the
#  running system. Do not read them as "what the vehicle does".
# ============================================================================
tracker_node:
  ros__parameters:

    # ---- Tracker engine ---------------------------------------------------- #
    # ocsort (Roboflow, DEFAULT — observation-centric, best dropout recovery:
    #   re-associates the SAME id when a target reappears after a gap) |
    # bytetrack (Roboflow two-stage) | legacy_bytetrack (supervision fallback).
    tracker_type: ocsort

    # Detection publish rate (Hz). EVERY coast window is sized from this, so a
    # wrong value makes the whole ladder wrong -- silently, because a tracker
    # with a truncated coast still publishes tracks and looks healthy. The node
    # MEASURES the real arrival rate and warns once if it disagrees by more
    # than frame_rate_warn_ratio, naming the real coast in seconds.
    #
    # 20 is the Jetson/ArduSub figure and is DELIBERATELY LEFT as the default:
    # this file is the fallback, and the two vehicles disagree with each other
    # AND with themselves. Measured on the Pi: forward 55 Hz, downward 15 Hz.
    # vision_pi.launch.py sets it per camera, which is the only place it can be
    # right, because one number cannot serve two cameras at different rates.
    frame_rate: 20.0

    # How far the measured rate may drift from the above before the node says
    # so. 1.5 is loose enough that ordinary jitter is quiet.
    frame_rate_warn_ratio: 1.5

    # ---- Association params ------------------------------------------------- #
    # Frames to hold a lost track alive before dropping it (scaled by frame_rate
    # above). MUST exceed the control loop's coast window (vision.coast_s) in
    # wall-time so a coasted target outlives the coast — see precision-alignment.md.
    track_buffer: 150

    # Consecutive detection frames before a new track is published.
    # 3 = require 3 consecutive frames before publishing (suppresses turbidity
    # false detections).
    #
    # ⚠ IN FRAMES, so it is a DWELL that shrinks as perception speeds up: 0.10 s
    # at the 20 Hz this was chosen at, 0.07 s at the Pi's measured 30. Same
    # shape as the coast window and the align dwell -- currently benign at
    # these rates (a turbidity false positive does not persist 70 ms), and
    # recorded here so it is re-derived rather than rediscovered if the
    # detector gets materially faster.
    min_hits: 3

    # ByteTrack only: score threshold above which a NEW track id is spawned.
    # 0.40 = higher confidence required than the default 0.25 to spawn a new ID.
    track_activation_threshold: 0.40

    # Two-stage split: detections at/above this are stage-1 (high conf); below
    # are stage-2, kept for association so weak REAL detections still maintain a
    # track without spawning a new id (shrinks the number of coasted frames).
    high_conf_det_threshold: 0.6

    # IoU threshold for the low-confidence second-pass association.
    # 0.2 = more permissive re-association → fewer ID switches on partial occlusion.
    iou_threshold: 0.2

    # ---- Kalman smoother --------------------------------------------------- #
    enable_kalman: true

    # Process noise Q diagonal. 0.05 = very smooth centre tracking; raise for
    # fast-moving targets where lag becomes visible.
    kalman_process_noise: 0.05

    # Measurement noise R diagonal. 2.0 = trust the Kalman prediction more than
    # raw detections → suppresses per-frame centre jitter from detector noise.
    kalman_measurement_noise: 2.0

    # How long the smoother keeps predicting with no real detection before it
    # suppresses the track from /tracks. The 4th rung of the control coast
    # ladder (_freshness < coast_s < lost_grace_s < THIS): it MUST exceed the
    # control loop's vision.coast_s, or a coasted target vanishes off /tracks
    # before coast_s elapses and the coast truncates early.
    #
    # SECONDS, not frames -- it was `max_predict_frames: 30`, which is 1.5 s at
    # 20 Hz and 0.31 s at the Hailo path's 98 Hz, i.e. UNDER a typical
    # coast_s of 0.8 s. Perception got 5x faster and this rung silently stopped
    # covering the one it exists to cover. The node converts to frames with
    # `frame_rate` above.
    max_predict_s: 1.5
